<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premade overlay</title>
<style>
/* League's gold and dark blue, or the app's theme when index.html sends it (theme) */
:root { --bg: #010a13; --panel: #0a1428; --raised: #0f1e35; --fg: #f0e6d2; --muted: #a09b8c; --gold: #c8aa6e; --gold-line: #785a28; --accent: #0ac8b9; --accent-fg: #010a13; --link: #0ac8b9; --talk: #0ac8b9; --good: #3ccf8e; --bad: #ff6b6b; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body.fade { opacity: 0 !important; transition: opacity 0.9s; } /* who's talking in other games, fading out once nobody talks */
body { font: 600 14px/1.2 'Segoe UI', system-ui, sans-serif; color: var(--fg); text-shadow: 0 1px 2px #000; user-select: none; }
#main { box-sizing: border-box; height: 100%; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
[data-pos="ml"] #main, [data-pos="mr"] #main { justify-content: center; }
[data-pos="mr"] #main { align-items: flex-end; }
.pill { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 3px 14px 3px 3px; border: 1px solid var(--gold-line); border-radius: 999px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pic { flex: none; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--talk); box-shadow: 0 0 10px var(--talk); color: var(--gold); font: 700 13px/1 Georgia, serif; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.enemy .pic { border-color: #ff5c5c; box-shadow: 0 0 10px #ff5c5c; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { padding: 5px 14px 5px 10px; border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.toast { max-width: 100%; box-sizing: border-box; padding: 6px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 90%, transparent); font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.chat b { color: var(--gold); margin-right: 6px; }
.swap { border-color: var(--accent); color: var(--link); font-weight: 600; }
.note { padding: 4px 12px; font-weight: 500; font-size: 13px; }
.game { border-color: var(--gold); font-variant-numeric: tabular-nums; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
/* Move it: a frame you can drag anywhere, with a sample of what shows in it */
body.edit { outline: 2px dashed var(--gold); outline-offset: -2px; background: color-mix(in srgb, var(--bg) 40%, transparent); -webkit-app-region: drag; cursor: move; }
.edit .toast { border-color: var(--gold); }
/* Everyone's rank (board, What's new 205: League's loading screen cards in Premade's look): Premade's own loading
   screen over all of League's (load), or the same cards at half size in the middle in a game (Alt+X), clear of the
   score, abilities and minimap. Your team on top on the red side, at the bottom on the blue side. Sized by the screen's
   height (1em = 1vh), like League's own screens; sizes in em as the mockup drew them. A stat's box (.pop) shows while
   the mouse is over it (CSS alone). */
body.board { font-size: calc(1vh * var(--k, 1)); }
.team { font-size: 0.8em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); } /* the toasts' heads */
.sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 0.9em; }
.board #main { display: block; padding: 0; }
.board .stack { position: absolute; z-index: 2; top: 1vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; }
.rb { --line: color-mix(in srgb, var(--fg) 13%, var(--bg)); --line2: color-mix(in srgb, var(--fg) 22%, var(--bg)); --goodL: color-mix(in srgb, var(--good) 60%, var(--fg)); --badL: color-mix(in srgb, var(--bad) 55%, var(--fg)); --blue: #4ea3e0;
  position: absolute; left: 50%; top: 9vh; transform: translateX(-50%) scale(0.5); transform-origin: 50% 0; width: max-content; display: flex; flex-direction: column; gap: 0.8em; padding: 1.4em; border-radius: 1.4em; background: color-mix(in srgb, var(--bg) 78%, transparent); }
.rb.load { inset: 0; transform: none; width: auto; padding: 3.4em 0 0; border-radius: 0; gap: 0; align-items: center; background: var(--bg); font-size: min(1em, 0.74vw, 1vh); } /* fits 4:3 and any overlay size */
.rb .team { font-size: 1.7em; line-height: 1.5; margin-bottom: 0.47em; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); white-space: nowrap; }
.rb.load .team { font-size: 1.3em; margin-bottom: 0.46em; }
.rb .team b { color: var(--fg); font-weight: 700; }
.crow { display: flex; gap: 2.6em; }
.tip { height: 5.2em; display: grid; place-items: center; }
.tip > span { max-width: 86em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1.5em; color: color-mix(in srgb, var(--fg) 82%, var(--bg)); }
.tip b { color: var(--fg); }
.pc { position: relative; flex: none; width: 24em; height: 42em; box-sizing: border-box; border-radius: 1.2em; border: 1px solid color-mix(in srgb, var(--fg) 16%, transparent); background: var(--raised); font-weight: 500; text-align: center; }
.pc.me { border: 2px solid var(--fg); }
.pc > .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; border-radius: inherit; }
.pc .chipx { position: absolute; top: 0.8em; left: 0.8em; padding: 0.15em 0.75em; border: 1px solid var(--fg); border-radius: 999px; background: color-mix(in srgb, var(--bg) 72%, transparent); font-size: 1.15em; font-weight: 600; text-shadow: none; white-space: nowrap; }
/* the art fades into the panel at the card's foot (the one gradient), under its seven parts */
.pc .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 3.2em 1.2em 1.3em; border-radius: 0 0 1.1em 1.1em; background: linear-gradient(transparent, color-mix(in srgb, var(--panel) 94%, transparent) 9em); display: flex; flex-direction: column; align-items: center; gap: 0.5em; text-shadow: 0 1px 3px #000; }
.chn { font-size: 1.4em; font-weight: 600; }
.kit { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; height: 5.8em; }
.ru { justify-self: start; display: flex; align-items: flex-end; gap: 0.25em; }
.ru > * { display: block; width: 1.9em; height: 1.9em; box-sizing: border-box; padding: 0.2em; border-radius: 50%; }
.ru > img { background: color-mix(in srgb, var(--bg) 75%, transparent); }
.ru > :first-child { width: 3.1em; height: 3.1em; padding: 0; }
.kit .emb { display: block; width: 5.8em; height: 5.8em; object-fit: contain; }
.kit i.emb { width: 4.6em; height: 4.6em; box-sizing: border-box; border-radius: 50%; border: 1px dashed var(--line2); } /* unranked */
.sp { justify-self: end; display: flex; gap: 0.3em; }
.sp img { display: block; width: 2.6em; height: 2.6em; border-radius: 0.35em; }
.rb .who { position: relative; display: flex; justify-content: center; width: 100%; min-width: 0; white-space: nowrap; }
.rb .who > b, .rb .who .pn { font-size: 1.75em; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.rb .who .pn { all: unset; font-size: 1.75em; font-weight: 700; overflow: hidden; text-overflow: ellipsis; cursor: pointer; } /* a name with a Riot ID opens their profile in Premade (What's new 195) */
.rb .who .pn:hover, .rb .who .pn:focus-visible { text-decoration: underline; }
.rkl { display: block; min-height: 1.2em; font-size: 1.2em; white-space: nowrap; color: color-mix(in srgb, var(--fg) 90%, var(--bg)); }
.srow { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 2.6em; }
.srow > .mu { flex: 1; font-size: 1.1em; }
.srow > .st > .blk { gap: 0.18em; }
.srow > .st > .blk i { width: 0.72em; height: 1.7em; border-radius: 0.15em; }
.chs { display: flex; align-items: center; gap: 0.6em; }
.chs > span:first-child { position: relative; flex: none; }
.chs img, .chs i { display: block; width: 2.6em; height: 2.6em; border-radius: 0.4em; }
.chs b.lv { position: absolute; right: -0.55em; bottom: -0.45em; width: 1.6em; height: 1.6em; box-sizing: border-box; border-radius: 50%; background: var(--bg); border: 1px solid var(--fg); display: grid; place-items: center; font-size: 0.85em; text-shadow: none; }
.chs > span:last-child { display: grid; line-height: 1.15; font-size: 1.1em; white-space: nowrap; text-align: left; }
.srow > .st > svg { display: block; width: 2.6em; height: 2.6em; }
.w { color: var(--goodL); } .l { color: var(--badL); } .mu { color: var(--muted); }
.st { position: relative; display: grid; justify-items: center; }
.pop { display: none; position: absolute; z-index: 5; left: -1em; bottom: calc(100% + 0.6em); width: max-content; box-sizing: border-box; padding: 1em 1.1em; border: 1px solid var(--line2); border-radius: 0.9em; background: var(--panel); box-shadow: 0 1.2em 3em rgb(0 0 0 / 0.6); text-shadow: none; color: var(--fg); font-size: 1em; font-weight: 500; text-align: left; justify-items: stretch; }
.rb:not(.load) .pop, .rb:not(.load) .mini { font-size: calc(1em / var(--bk, 0.5)); } /* in a game the board is at 0.5 (or its own size), the boxes at the loading screen's size */
/* What's new 179: in a game, drag the board by its top line anywhere and resize it by its corner; it stays there
   (ovCards in this page's storage: left and top as shares of the screen, k its size). A double-click on the line puts it back. */
.rb:not(.load) > :first-child > .team { cursor: move; }
.rb .rsz { position: absolute; right: 0; bottom: 0; width: 3.2em; height: 3.2em; cursor: nwse-resize; border-radius: 0 0 1.4em 0; background: linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--fg) 45%, transparent) 55% 63%, transparent 63% 75%, color-mix(in srgb, var(--fg) 45%, transparent) 75% 83%, transparent 83%); }
.rb.load .rsz { display: none; }
.pop.dn { bottom: auto; top: calc(100% + 0.6em); }
.pop.rt { left: auto; right: -1em; }
.st:hover .pop { display: grid; gap: 0.7em; }
.st:hover .pop.role { gap: 0.35em; }
.st:hover .pop.sea { gap: 0.8em; }
.pop i { display: block; font-style: normal; }
.pop img { display: block; }
.blk { display: flex; gap: 0.22em; }
.blk i { width: 1.15em; height: 1.5em; border-radius: 0.2em; background: var(--bad); }
.blk i.w { background: var(--good); }
.grs { display: grid; gap: 0.3em; }
.gr { display: grid; grid-template-columns: 0.32em 3.4em 9.4em 5.6em 5.2em; align-items: center; column-gap: 0.7em; height: 4em; padding-right: 0.7em; border-radius: 0.5em; background: rgb(255 255 255 / 0.035); --c: var(--bad); }
.gr.win { --c: var(--good); }
.gr > i { align-self: stretch; border-radius: 0.5em 0 0 0.5em; background: var(--c); }
.gr > img { width: 3.4em; height: 3.4em; border-radius: 0.45em; }
.res, .kda { display: grid; min-width: 0; line-height: 1.2; }
.res b { font-size: 1.35em; color: var(--c); }
.res span { font-size: 1.05em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kda b { font-size: 1.25em; font-weight: 700; white-space: nowrap; }
.kda .sl { color: color-mix(in srgb, var(--fg) 35%, var(--bg)); }
.kda > span { font-size: 1em; color: color-mix(in srgb, var(--muted) 85%, var(--bg)); }
.its { display: grid; grid-template-columns: repeat(3, 1.6em); gap: 0.2em; }
.its > * { width: 1.6em; height: 1.6em; box-sizing: border-box; border-radius: 0.25em; }
.its > i { background: var(--raised); border: 1px solid var(--line); }
.br { display: grid; grid-template-columns: 2.8em 8em 6.5em 5.6em; column-gap: 0.9em; align-items: center; min-height: 3.5em; }
.br.hd { min-height: 0; font-size: 1.05em; color: var(--muted); }
.sea .br { min-height: 3.3em; }
.br > svg { display: block; width: 2.8em; height: 2.8em; }
.br > img { width: 2.8em; height: 2.8em; border-radius: 0.4em; }
.bar { display: grid; gap: 0.25em; }
.bar > i { height: 1.1em; border-radius: 0.2em; background: var(--line); overflow: hidden; }
.bar > i > i { height: 100%; }
.bar > span { font-size: 1.15em; font-weight: 600; }
.now { justify-self: start; padding: 0.15em 0.6em; border-radius: 999px; border: 1px solid var(--line2); color: var(--fg); font-size: 0.95em; font-weight: 600; white-space: nowrap; }
.now.off { border-color: var(--bad); color: var(--badL); }
.sec { display: grid; gap: 0.35em; }
.sec > span { font-size: 1em; color: var(--muted); }
.pk { display: flex; align-items: center; gap: 0.8em; }
.pk .emb, .rkc .emb { width: 3.2em; height: 3.2em; object-fit: contain; }
.pk b { font-size: 1.35em; white-space: nowrap; }
.hr { height: 1px; background: var(--line); }
/* the tags stay inside the card (What's new 217): side by side when they fit, else the second on a line under the
   first. Every card keeps room for 2 lines so the cards still line up; a tag wider than the card ends in "…" */
.rb .chips { display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 0.4em; width: 100%; min-height: 4em; }
.rb .chip { max-width: 100%; box-sizing: border-box; padding: 0.1em 0.75em; border: 1px solid #6b6a66; border-radius: 999px; font-size: 1.12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: none; }
.rb .chip.good { border-color: var(--good); color: var(--goodL); }
.rb .chip.bad { border-color: var(--bad); color: var(--badL); }
/* the mini profile (What's new 205, planned as 201): while the mouse rests on a name, who they are; what the card
   shows isn't in it. Under the card on the top half of the screen, above the name on the bottom half; look only. */
.mini { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); width: 34em; box-sizing: border-box; border: 1px solid var(--line2); border-radius: 0.9em; overflow: hidden; background: var(--panel); box-shadow: 0 1.2em 3em rgb(0 0 0 / 0.6); text-shadow: none; color: var(--fg); font-size: 1em; font-weight: 500; line-height: 1.2; text-align: left; white-space: normal; pointer-events: none; visibility: hidden; }
.mini.on { visibility: visible; }
.mini.up { bottom: calc(100% + 0.6em); }
.mini.dn { top: calc(100% + 0.6em); }
.mini.rt { left: auto; right: 0; transform: none; }
.mini.lf { left: 0; transform: none; }
.ban { height: 11em; }
.ban img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; -webkit-mask-image: linear-gradient(#000 30%, transparent); mask-image: linear-gradient(#000 30%, transparent); } /* the splash fading into the panel */
.mh { position: relative; display: flex; align-items: flex-end; gap: 1em; margin: -3.4em 1.2em 0; }
.mh .ico { display: block; flex: none; width: 6.4em; height: 6.4em; box-sizing: border-box; border-radius: 50%; border: 0.2em solid var(--fg); background: var(--raised); }
.mn { display: grid; gap: 0.15em; min-width: 0; padding-bottom: 0.3em; }
.mn > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mn b { font-size: 2em; }
.mn .mu { font-size: 1.3em; }
.mn .lv { font-size: 1.15em; color: color-mix(in srgb, var(--fg) 85%, var(--bg)); }
.mb { display: grid; gap: 1.1em; padding: 1.3em 1.2em 1.2em; }
.cells { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1em; }
.rkc { display: grid; gap: 0.35em; min-width: 0; }
.rkc > span { color: var(--muted); }
.rkc > div { display: flex; align-items: center; gap: 0.6em; min-width: 0; }
.rkc > div > span { display: grid; line-height: 1.25; min-width: 0; }
.rkc b { font-size: 1.25em; white-space: nowrap; }
.rkc div .mu { white-space: nowrap; }
.mrw { display: flex; gap: 1.5em; }
.mrw > span { position: relative; display: grid; justify-items: center; gap: 0.3em; }
.mrw img, .mrw i { display: block; width: 3.6em; height: 3.6em; border-radius: 0.45em; }
.mrw b { position: absolute; top: 2.45em; right: -0.55em; width: 1.6em; height: 1.6em; box-sizing: border-box; border-radius: 50%; background: var(--bg); border: 1px solid var(--fg); display: grid; place-items: center; font-size: 0.9em; font-weight: 700; }
.mrw > span > span { color: var(--muted); }
.mb > .dim { color: color-mix(in srgb, var(--muted) 80%, var(--bg)); }
/* The whole screen (full): the rest sits where the small window would be (place), and a part with a place of its own
   (part: the Overlay page's layout) where it was put, growing away from the screen's nearest edges */
.full #main { position: absolute; width: 300px; height: 360px; overflow: hidden; transform-origin: 0 0; }
.grp { display: flex; flex-direction: column; align-items: inherit; gap: 6px; max-width: 100%; }
.part { position: absolute; width: max-content; max-width: 340px; }
/* the other team off your minimap (missing): a row each, with how long since they were seen and where they were heading */
.miss { display: grid; grid-template-columns: auto auto auto auto; align-items: center; gap: 4px 8px; padding: 6px 10px; }
.miss .team { grid-column: 1 / -1; font-size: 11px; }
.mrow { display: contents; }
.miss .pic { width: 22px; height: 22px; border-color: #ff5c5c; box-shadow: none; font-size: 11px; }
.mt { font-variant-numeric: tabular-nums; text-align: right; }
.miss .sub { font-size: 13px; }
/* TFT's item recipes (tft): the components along the top and side and what each pair makes, gold rings on the items
   your comp wants */
.rec { display: grid; gap: 2px; padding: 6px; }
.rec img { width: 20px; height: 20px; border-radius: 3px; }
.rec img.want { outline: 2px solid var(--gold); outline-offset: -1px; box-shadow: 0 0 6px var(--gold); }
/* on TFT's augment cards (cards): how you placed with each, at the foot of the card, sized by the screen like the cards */
.augc { position: absolute; transform: translate(-50%, -50%); max-width: 17vw; padding: 0.35em 0.9em; border-radius: 999px; font-size: 1.6vh; text-align: center; }
.augc.good { border-color: var(--good); }
.augc.bad { border-color: var(--bad); }
/* ARAM: Mayhem has its own transparent full-screen layer and card-specific rating layout. */
#mayhem { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.may-rate { position: absolute; transform: translate(-50%, -50%); max-width: 13vw; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; font-size: 1.35vh; text-align: center; text-shadow: 0 2px 4px #000, 0 0 2px #000; }
.may-rate.bar { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.35vh; white-space: normal; }
.may-rate.tier-only { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.2vh; white-space: normal; }
.may-rate .augt { display: grid; justify-items: center; gap: 0.15vh; }
.may-rate .augp { white-space: nowrap; font: 700 2.1vh/1 Georgia, serif; color: var(--fg); font-variant-numeric: tabular-nums; }
.may-rate .augs { font-size: 1vh; color: var(--fg); text-align: center; }
.may-rate .augtrack { width: 100%; height: 0.6vh; border-radius: 999px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
.may-rate .augfill { height: 100%; border-radius: inherit; background: var(--fg); transition: width 0.4s; }
/* What's new 180: no glows or gradients; the best card's tier and bar in gold, and outlined pills under it (a card can carry two) */
.may-rate.good .augp { color: #e8b84a; }
.may-rate.good .augfill { background: #e8b84a; }
.may-rate .augtags { display: grid; justify-items: center; gap: 0.4vh; margin-top: 0.2vh; }
.may-rate .augtag { --c: #e9e1e2; display: inline-flex; align-items: center; gap: 0.5vh; padding: 0.15vh 0.9vh; border: 1px solid var(--c); border-radius: 999px; background: rgb(21 16 18 / 0.7); color: var(--c); font-size: 1.1vh; font-weight: 600; text-shadow: none; white-space: nowrap; }
.may-rate .augtag.best { --c: #e8b84a; } .may-rate .augtag.pair { --c: #3ccf8e; padding-left: 0.25vh; } .may-rate .augtag.bad { --c: #ff6b6b; }
.may-rate .augtag img { width: 1.6vh; height: 1.6vh; border-radius: 50%; }
.may-rate .augp.none { color: #ab9c9e; }
/* the Best for <champion> box: 2 of each rarity as rarity rings with a tier badge, and your picks (dashed: to come) */
.maybox { display: grid; gap: 8px; width: 320px; padding: 10px 12px; }
.maybox .mhead { font-weight: 600; }
.maybox .mrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.maybox .mgrp { display: grid; gap: 4px; justify-items: start; font-size: 12px; color: var(--muted); }
.maybox .mtwo, .maybox .mine { display: flex; align-items: center; gap: 6px; }
.maybox .mine { padding-top: 8px; border-top: 1px solid var(--gold-line); font-size: 12px; color: var(--muted); }
.mau { --ring: var(--gold-line); position: relative; flex: none; width: 40px; height: 40px; box-sizing: border-box; border: 2px solid var(--ring); border-radius: 50%; background: var(--raised); display: grid; place-items: center; font: 700 12px/1 system-ui, sans-serif; color: var(--fg); }
.mau.prismatic { --ring: #c58cff; } .mau.gold { --ring: #e8b84a; } .mau.silver { --ring: #b9c0c8; }
.mau img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.mau b { position: absolute; right: -4px; bottom: -4px; min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; border-radius: 4px; background: var(--fg); color: var(--bg); font: 700 11px/16px system-ui, sans-serif; text-align: center; }
.mau b.top { background: #e8b84a; color: #151012; }
.maybox .mtwo .mau { width: 36px; height: 36px; } /* 3 rarities of 2 fit the overlay's 280 px column */

      const k = c.k === 'good' || c.k === 'bad' ? ' ' + c.k : '', v = +c.v, tierOnly = c.tierOnly === true && Number.isFinite(v), bar = !tierOnly && Number.isFinite(v), words = bar || tierOnly || !!c.p;
      const b = el('may-rate' + (words ? (tierOnly ? ' tier-only' : ' bar') : '') + k, words ? '' : String(c.t || ''));
      if (words) {
        const top = el('augt'), track = el('augtrack'), fill = el('augfill'), tags = el('augtags');
        top.append(el('augp' + (bar || tierOnly ? '' : ' none'), tierOnly ? `Tier ${c.tier || '?'}` : String(c.p || '')), el('augs', tierOnly ? `${c.score ?? ''} DeepScore` : String(c.s || '')));
        if (bar) { fill.style.width = `${Math.min(1, Math.max(0, v)) * 100}%`; track.append(fill); }
        tags.append(...(Array.isArray(c.tags) ? c.tags : []).filter((t) => Array.isArray(t)).map(([w, kind, pic]) => {
          const t = el('augtag' + (/^(best|fit|pair|new|bad)$/.test(kind) ? ' ' + kind : ''));
          if (pic) t.append(Object.assign(new Image(), { src: String(pic), alt: '' }));
          t.append(String(w));
          return t;
        }));
        b.append(...(bar ? [track] : []), top, ...(tags.childElementCount ? [tags] : []));
        b.title = String(c.t || '');
      }
      b.style.left = `${Math.min(1, Math.max(0, +c.x)) * 100}%`;
      b.style.top = `${Math.min(1, Math.max(0, +c.y)) * 100}%`;
      return b;
    }) : [];
    parts.replaceChildren(...own, ...cards);
    mayhemLayer.replaceChildren(...mayCards);
    // over everyone's rank only callouts, voices, room chat and popups: the game's own parts (the timers line with the win
    // chance, CS, the enemy spell strip, what to buy...) covered the cards (What's new 208), so they wait until it goes
    if (players) { const stack = el('stack'); stack.append(...out.filter((n) => !n.dataset.part || /^(me|talk|chat|toasts)$/.test(n.dataset.part))); main.replaceChildren(stack, board(s.board)); } else main.replaceChildren(...out);
    if (taking && !document.querySelector('[data-take]')) take(false);
  };
  api.on('overlay', (s) => { lastOverlayState = s; renderOverlay(s); });
  addEventListener('resize', () => { if (lastOverlayState && lastOverlayState.visible) renderOverlay(lastOverlayState); });
</script>
</body>
</html>
