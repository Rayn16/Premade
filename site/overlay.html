<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premade overlay</title>
<style>
/* League's gold and dark blue, or the app's theme when index.html sends it (theme) */
:root { --bg: #010a13; --panel: #0a1428; --raised: #0f1e35; --fg: #f0e6d2; --muted: #a09b8c; --gold: #c8aa6e; --gold-line: #785a28; --accent: #0ac8b9; --accent-fg: #010a13; --link: #0ac8b9; --talk: #0ac8b9; --good: #3ccf8e; --bad: #ff6b6b; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body.fade { opacity: 0 !important; transition: opacity 0.9s; } /* who's talking in other games, fading out once nobody talks */
body { font: 600 14px/1.2 'Segoe UI', system-ui, sans-serif; color: var(--fg); text-shadow: 0 1px 2px #000; user-select: none; }
#main { box-sizing: border-box; height: 100%; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
[data-pos="ml"] #main, [data-pos="mr"] #main { justify-content: center; }
[data-pos="mr"] #main { align-items: flex-end; }
.pill { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 3px 14px 3px 3px; border: 1px solid var(--gold-line); border-radius: 999px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pic { flex: none; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--talk); box-shadow: 0 0 10px var(--talk); color: var(--gold); font: 700 13px/1 Georgia, serif; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.enemy .pic { border-color: #ff5c5c; box-shadow: 0 0 10px #ff5c5c; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { padding: 5px 14px 5px 10px; border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.toast { max-width: 100%; box-sizing: border-box; padding: 6px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 90%, transparent); font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.chat b { color: var(--gold); margin-right: 6px; }
.swap { border-color: var(--accent); color: var(--link); font-weight: 600; }
.note { padding: 4px 12px; font-weight: 500; font-size: 13px; }
.game { border-color: var(--gold); font-variant-numeric: tabular-nums; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
/* Move it: a frame you can drag anywhere, with a sample of what shows in it */
body.edit { outline: 2px dashed var(--gold); outline-offset: -2px; background: color-mix(in srgb, var(--bg) 40%, transparent); -webkit-app-region: drag; cursor: move; }
.edit .toast { border-color: var(--gold); }
/* Everyone's rank (board, What's new 166-168): Premade's own loading screen over all of League's (load), or the same
   smaller in the middle in a game (Alt+V), clear of the score, abilities and minimap. Your team on top on the red side,
   at the bottom on the blue side. Sized by the screen's height (1em = 1vh), like League's own screens. Cards (A), rows
   (B) or your lane first (D). A stat's box (.pop) shows while the mouse is over it (CSS alone). */
body.board { font-size: calc(1vh * var(--k, 1)); }
.team { font-size: 0.8em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); } /* the toasts' heads */
.sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 0.9em; }
.board #main { display: block; padding: 0; }
.board .stack { position: absolute; z-index: 2; top: 1vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; }
.rb { position: absolute; left: 50%; top: 9vh; transform: translateX(-50%) scale(0.62); transform-origin: 50% 0; display: flex; flex-direction: column; gap: 1.6em; width: 172em; }
.rb.load { inset: 0; top: 0; transform: none; width: auto; padding: 6em 6.7em 2em; box-sizing: border-box; background: radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--raised) 70%, var(--bg)), var(--bg) 72%); gap: 2.2em; }
.rhead { display: flex; justify-content: space-between; font-size: 1.5em; color: var(--muted); }
.rhead b { color: var(--fg); }
.rb:not(.load) { padding: 1.6em; border-radius: 1.6em; background: color-mix(in srgb, var(--bg) 72%, transparent); }
.rb:not(.load) .rhead span:first-child { display: none; }
.rb .team { font-size: 1.5em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); margin-bottom: 0.6em; }
.rb .foes .team { color: var(--bad); }
.crow { display: flex; gap: 2.2em; }
.pc { position: relative; flex: 1; min-width: 0; height: 35em; box-sizing: border-box; border-radius: 1.3em; border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent); background: var(--raised); font-weight: 500; }
.pc.foe { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.pc.me { border: 2px solid var(--fg); box-shadow: 0 0 2em color-mix(in srgb, var(--fg) 45%, transparent); }
.pc > .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; border-radius: inherit; }
.pc .chipx { position: absolute; top: 0.9em; left: 0.9em; padding: 0.25em 0.9em; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 1.2em; font-weight: 700; text-shadow: none; }
.pc .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.8em 1.3em 1.3em; border-radius: 0 0 1.3em 1.3em; display: grid; gap: 0.45em; text-shadow: 0 1px 3px #000, 0 0 0.8em #000; } /* What's new 179: no dark band, a shadow keeps it readable */
.rb .who { display: flex; align-items: baseline; gap: 0.7em; white-space: nowrap; min-width: 0; }
.rb .who b { font-size: 1.75em; overflow: hidden; text-overflow: ellipsis; }
.rb .sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 1.3em; }
.rb .rk { display: flex; align-items: center; gap: 0.6em; font-size: 1.45em; font-weight: 600; }
/* What's new 179: the three rings close together and the rank beside them (tier big, LP and record under it) */
.rline { display: flex; align-items: center; gap: 0.8em; margin-top: 0.35em; }
.rline .rk { flex: 1; min-width: 0; font-size: 1.4em; }
.rk span { display: block; font-size: 0.85em; font-weight: 500; }
.rb .rk img { width: 1.7em; height: 1.7em; object-fit: contain; }
.rb .ch { font-size: 1.3em; }
/* the three rings (What's new 174, like Porofessor's): Last 20 and Season with the win % inside, green from 55%, red at
   45% or less, W and L under; the main role's icon in the middle, red when they play another role this game. Each
   ring's box (.pop) opens on hover: below on the top half of the screen, above on the bottom half (.dn), lined up to
   the right where it would go off the screen (.rt). Sizes in em (1vh), as the mockup drew them. */
.rb { --line: color-mix(in srgb, var(--fg) 13%, var(--bg)); --line2: color-mix(in srgb, var(--fg) 22%, var(--bg)); --goodL: color-mix(in srgb, var(--good) 60%, var(--fg)); --badL: color-mix(in srgb, var(--bad) 55%, var(--fg)); --blue: #4ea3e0; }
.st3 { display: grid; grid-template-columns: repeat(3, auto); gap: 0.25em; }
.st { position: relative; display: grid; justify-items: center; gap: 0.15em; }
.st > svg { display: block; width: 5.2em; height: 5.2em; }
.vl { font-size: 1.1em; font-weight: 700; white-space: nowrap; }
.w { color: var(--goodL); } .l { color: var(--badL); } .mu { color: var(--muted); } .vl.off { color: var(--badL); }
.pop { display: none; position: absolute; z-index: 5; left: -1em; bottom: calc(100% + 0.6em); width: max-content; box-sizing: border-box; padding: 1em 1.1em; border: 1px solid var(--line2); border-radius: 0.9em; background: color-mix(in srgb, var(--panel) 97%, transparent); box-shadow: 0 1.2em 3em rgb(0 0 0 / 0.6); text-shadow: none; color: var(--fg); font-size: 1em; font-weight: 500; justify-items: stretch; }
.rb:not(.load) .pop { font-size: calc(1em / var(--bk, 0.62)); } /* in a game the board is at 0.62 (or its own size), the boxes at the loading screen's size */
/* What's new 179: in a game, drag the board by its top line anywhere and resize it by its corner; it stays there
   (ovBoard in this page's storage: left and top as shares of the screen, k its size). A double-click on the line puts it back. */
.rb:not(.load) .rhead { cursor: move; }
.rb .rsz { position: absolute; right: 0; bottom: 0; width: 3.2em; height: 3.2em; cursor: nwse-resize; border-radius: 0 0 1.6em 0; background: linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--fg) 45%, transparent) 55% 63%, transparent 63% 75%, color-mix(in srgb, var(--fg) 45%, transparent) 75% 83%, transparent 83%); }
.rb.load .rsz { display: none; }
.pop.dn { bottom: auto; top: calc(100% + 0.6em); }
.pop.rt { left: auto; right: -1em; }
.st:hover .pop { display: grid; gap: 0.7em; }
.st:hover .pop.role { gap: 0.35em; }
.st:hover .pop.sea { gap: 0.8em; }
.pop i { display: block; font-style: normal; }
.pop img { display: block; }
.blk { display: flex; gap: 0.22em; }
.blk i { width: 1.15em; height: 1.5em; border-radius: 0.2em; background: var(--bad); }
.blk i.w { background: var(--good); }
.grs { display: grid; gap: 0.3em; }
.gr { display: grid; grid-template-columns: 0.32em 3.4em 9.4em 5.6em 5.2em; align-items: center; column-gap: 0.7em; height: 4em; padding-right: 0.7em; border-radius: 0.5em; background: rgb(255 255 255 / 0.035); --c: var(--bad); }
.gr.win { --c: var(--good); }
.gr > i { align-self: stretch; border-radius: 0.5em 0 0 0.5em; background: var(--c); }
.gr > img { width: 3.4em; height: 3.4em; border-radius: 0.45em; }
.res, .kda { display: grid; min-width: 0; line-height: 1.2; }
.res b { font-size: 1.35em; color: var(--c); }
.res span { font-size: 1.05em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kda b { font-size: 1.25em; font-weight: 700; white-space: nowrap; }
.kda .sl { color: color-mix(in srgb, var(--fg) 35%, var(--bg)); }
.kda > span { font-size: 1em; color: color-mix(in srgb, var(--muted) 85%, var(--bg)); }
.its { display: grid; grid-template-columns: repeat(3, 1.6em); gap: 0.2em; }
.its > * { width: 1.6em; height: 1.6em; box-sizing: border-box; border-radius: 0.25em; }
.its > i { background: var(--raised); border: 1px solid var(--line); }
.br { display: grid; grid-template-columns: 2.8em 8em 6.5em 5.6em; column-gap: 0.9em; align-items: center; min-height: 3.5em; }
.br.hd { min-height: 0; font-size: 1.05em; color: var(--muted); }
.sea .br { min-height: 3.3em; }
.br > svg { display: block; width: 2.8em; height: 2.8em; }
.br > img { width: 2.8em; height: 2.8em; border-radius: 0.4em; }
.bar { display: grid; gap: 0.25em; }
.bar > i { height: 1.1em; border-radius: 0.2em; background: var(--line); overflow: hidden; }
.bar > i > i { height: 100%; }
.bar > span { font-size: 1.15em; font-weight: 600; }
.now { justify-self: start; padding: 0.15em 0.6em; border-radius: 999px; border: 1px solid var(--line2); color: var(--fg); font-size: 0.95em; font-weight: 600; white-space: nowrap; }
.now.off { border-color: var(--bad); color: var(--badL); }
.ranks { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; column-gap: 1em; align-items: center; }
.ranks > .emb { width: 4.4em; height: 4.4em; object-fit: contain; }
.rn { display: grid; line-height: 1.25; }
.rn b { font-size: 1.35em; white-space: nowrap; }
.rn span { font-size: 1.05em; color: var(--muted); }
.rn .vl { font-size: 1.1em; color: var(--fg); }
.sm { display: grid; justify-items: center; gap: 0.2em; }
.sm > span { font-size: 0.95em; color: var(--muted); }
.sm .emb { width: 2.6em; height: 2.6em; object-fit: contain; }
.sm b { font-size: 1em; font-weight: 600; white-space: nowrap; }
.sec { display: grid; gap: 0.35em; }
.sec.ms { gap: 0.45em; }
.sec > span { font-size: 1em; color: var(--muted); }
.mrw { display: flex; gap: 1.2em; }
.mrw > span { position: relative; display: grid; justify-items: center; gap: 0.3em; }
.mrw img { width: 3.2em; height: 3.2em; border-radius: 0.45em; }
.mrw b { position: absolute; top: 2.15em; right: -0.5em; width: 1.6em; height: 1.6em; box-sizing: border-box; border-radius: 50%; background: var(--bg); border: 1px solid var(--fg); display: grid; place-items: center; font-size: 0.9em; font-weight: 700; }
.mrw > span > span { font-size: 1em; color: var(--muted); }
.hr { height: 1px; background: var(--line); }
.rows .st > svg, .lane .st > svg { width: 3.6em; height: 3.6em; } /* B and D: the same rings, smaller */
.rb .chips { display: flex; flex-wrap: wrap; gap: 0.4em; }
.rb .chip { padding: 0.1em 0.8em; border: 1px solid #6b6a66; border-radius: 999px; font-size: 1.2em; white-space: nowrap; }
.rb .chip.good { border-color: var(--good); color: color-mix(in srgb, var(--good) 60%, var(--fg)); }
.rb .chip.bad { border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.tipband { display: flex; align-items: center; gap: 2.6em; padding: 0.9em 1.9em; border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius: 1.1em; background: color-mix(in srgb, var(--panel) 88%, transparent); font-size: 1.4em; }
.tipband b { flex: none; text-transform: uppercase; letter-spacing: 0.06em; }
.tipband span { flex: 1; }
/* B, rows: a row per player */
.rows .pc { flex: none; height: auto; display: grid; grid-template-columns: 6em 20em 19em minmax(0, 1fr) 44em 26em; align-items: center; gap: 1.2em; padding: 0.6em 1em; background: color-mix(in srgb, var(--panel) 92%, transparent); }
.rows .crow { flex-direction: column; gap: 0.6em; }
.rows .pc > .art { position: static; width: 6em; height: 6em; border-radius: 0.7em; object-position: 50% 15%; }
.rows .pc .chipx { top: -0.5em; left: -0.5em; font-size: 1em; }
.rows .pc .info, .rows .rline { display: contents; }
.rows .who { grid-column: 2; } .rows .rk { grid-column: 3; grid-row: 1; } .rows .ch { grid-column: 4; } .rows .st3 { grid-column: 5; grid-row: 1; } .rows .chips { grid-column: 6; }
/* D, your lane first: you and your lane opponent big in the middle with the tips, the others small above and below */
.lane .small .pc { height: 18em; }
.lane .small .ch { display: none; }
.lane .mid { display: flex; gap: 2.2em; align-items: stretch; }
.lane .mid .pc { flex: none; width: 40em; height: 38em; }
.lane .mid .tipband { flex: 1; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1em; }
/* The whole screen (full): the rest sits where the small window would be (place), and a part with a place of its own
   (part: the Overlay page's layout) where it was put, growing away from the screen's nearest edges */
.full #main { position: absolute; width: 300px; height: 360px; overflow: hidden; transform-origin: 0 0; }
.grp { display: flex; flex-direction: column; align-items: inherit; gap: 6px; max-width: 100%; }
.part { position: absolute; width: max-content; max-width: 340px; }
/* the other team off your minimap (missing): a row each, with how long since they were seen and where they were heading */
.miss { display: grid; grid-template-columns: auto auto auto auto; align-items: center; gap: 4px 8px; padding: 6px 10px; }
.miss .team { grid-column: 1 / -1; font-size: 11px; }
.mrow { display: contents; }
.miss .pic { width: 22px; height: 22px; border-color: #ff5c5c; box-shadow: none; font-size: 11px; }
.mt { font-variant-numeric: tabular-nums; text-align: right; }
.miss .sub { font-size: 13px; }
/* TFT's item recipes (tft): the components along the top and side and what each pair makes, gold rings on the items
   your comp wants */
.rec { display: grid; gap: 2px; padding: 6px; }
.rec img { width: 20px; height: 20px; border-radius: 3px; }
.rec img.want { outline: 2px solid var(--gold); outline-offset: -1px; box-shadow: 0 0 6px var(--gold); }
/* on TFT's augment cards (cards): how you placed with each, at the foot of the card, sized by the screen like the cards */
.augc { position: absolute; transform: translate(-50%, -50%); max-width: 17vw; padding: 0.35em 0.9em; border-radius: 999px; font-size: 1.6vh; text-align: center; }
.augc.good { border-color: var(--good); }
.augc.bad { border-color: var(--bad); }
/* ARAM: Mayhem has its own transparent full-screen layer and card-specific rating layout. */
#mayhem { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.may-rate { position: absolute; transform: translate(-50%, -50%); max-width: 13vw; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; font-size: 1.35vh; text-align: center; text-shadow: 0 2px 4px #000, 0 0 2px #000; }
.may-rate.bar { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.35vh; white-space: normal; }
.may-rate.tier-only { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.2vh; white-space: normal; }
.may-rate .augt { display: grid; justify-items: center; gap: 0.15vh; }
.may-rate .augp { white-space: nowrap; font: 700 2.1vh/1 Georgia, serif; color: var(--fg); font-variant-numeric: tabular-nums; }
.may-rate .augs { font-size: 1vh; color: var(--fg); text-align: center; }
.may-rate .augtrack { width: 100%; height: 0.6vh; border-radius: 999px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
.may-rate .augfill { height: 100%; border-radius: inherit; background: var(--fg); transition: width 0.4s; }
/* What's new 180: no glows or gradients; the best card's tier and bar in gold, and outlined pills under it (a card can carry two) */
.may-rate.good .augp { color: #e8b84a; }
.may-rate.good .augfill { background: #e8b84a; }
.may-rate .augtags { display: grid; justify-items: center; gap: 0.4vh; margin-top: 0.2vh; }
.may-rate .augtag { --c: #e9e1e2; display: inline-flex; align-items: center; gap: 0.5vh; padding: 0.15vh 0.9vh; border: 1px solid var(--c); border-radius: 999px; background: rgb(21 16 18 / 0.7); color: var(--c); font-size: 1.1vh; font-weight: 600; text-shadow: none; white-space: nowrap; }
.may-rate .augtag.best { --c: #e8b84a; } .may-rate .augtag.pair { --c: #3ccf8e; padding-left: 0.25vh; } .may-rate .augtag.bad { --c: #ff6b6b; }
.may-rate .augtag img { width: 1.6vh; height: 1.6vh; border-radius: 50%; }
.may-rate .augp.none { color: #ab9c9e; }
/* the Best for <champion> box: 2 of each rarity as rarity rings with a tier badge, and your picks (dashed: to come) */
.maybox { display: grid; gap: 8px; width: 320px; padding: 10px 12px; }
.maybox .mhead { font-weight: 600; }
.maybox .mrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.maybox .mgrp { display: grid; gap: 4px; justify-items: start; font-size: 12px; color: var(--muted); }
.maybox .mtwo, .maybox .mine { display: flex; align-items: center; gap: 6px; }
.maybox .mine { padding-top: 8px; border-top: 1px solid var(--gold-line); font-size: 12px; color: var(--muted); }
.mau { --ring: var(--gold-line); position: relative; flex: none; width: 40px; height: 40px; box-sizing: border-box; border: 2px solid var(--ring); border-radius: 50%; background: var(--raised); display: grid; place-items: center; font: 700 12px/1 system-ui, sans-serif; color: var(--fg); }
.mau.prismatic { --ring: #c58cff; } .mau.gold { --ring: #e8b84a; } .mau.silver { --ring: #b9c0c8; }
.mau img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.mau b { position: absolute; right: -4px; bottom: -4px; min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; border-radius: 4px; background: var(--fg); color: var(--bg); font: 700 11px/16px system-ui, sans-serif; text-align: center; }
.mau b.top { background: #e8b84a; color: #151012; }
.maybox .mtwo .mau { width: 36px; height: 36px; } /* 3 rarities of 2 fit the overlay's 280 px column */
.mau.sm { width: 24px; height: 24px; font-size: 9px; } .mau.due { border: 1px dashed var(--muted); background: none; }
/* the card over League's end screen (after) */
.after { min-width: 220px; padding: 10px 14px; font-size: 15px; display: grid; gap: 4px; }
.after .team { font-size: 13px; }
.after.win { border-color: var(--good); }
.after.loss { border-color: var(--bad); }
.after button { justify-self: start; margin: 4px 0 0; }
/* The line at the top (the minimap reminder, the jungler callout): in the middle, fading in and out (on); first in the
   rest over everyone's rank */
.nudge { padding: 6px 16px 6px 12px; border-color: var(--gold); font-size: 15px; }
.nudge svg { width: 18px; height: 18px; stroke-linejoin: round; }
/* up to 3 callouts at once, newest on top (What's new 181); a plain show and hide, as the overlay never animates */
#call { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%) scale(var(--k, 1)); transform-origin: 50% 0; opacity: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#call.on { opacity: 1; }
body:not(.full) #call, body:not(.full) #ghosts { display: none; }
/* a power spike as pictures (What's new 164): their champion and the item, or their champion and the level */
.cpics { display: flex; align-items: center; gap: 8px; }
.pill:not(.pics) .cpics, .pill.pics > svg, .pill.pics > span:last-child { display: none; }
.pill.pics { padding: 5px 7px; }
.cpics img { width: 36px; height: 36px; border-radius: 7px; }
.cpics img:first-child { border-radius: 50%; border: 2px solid var(--gold); box-sizing: border-box; }
/* every callout as faces and signs with 1 to 3 words (What's new 181): their face in a red ring, your team's in a light

.cpics img.face.a { border-color: #f0e6d2; }
.cpics img.face.d { filter: grayscale(1); }
.cpics .sign { width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; display: grid; place-items: center; }
.cpics .sign.foe { border: 2px solid #ff5c5c; }
.cpics .sign svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cpics .cw { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cpics .mate { width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 2px solid #0ac8b9; background: #0a1428; display: grid; place-items: center; font: 700 15px/1 Georgia, serif; }
.pill.pics.words { padding: 5px 16px 5px 5px; }
/* the enemy strip (What's new 183): each enemy's face in a red ring, two summoner spells and the ultimate; a click
   starts its timer for your team, again stops it; time left over the icon, a teal letter for a teammate's */
.strip { display: grid; gap: 4px; padding: 6px; border: 1px solid var(--gold-line); border-radius: 6px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.strip .srow { display: flex; align-items: center; gap: 4px; }
.strip .sface { width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 2px solid #ff5c5c; object-fit: cover; }
.strip button { position: relative; width: 30px; height: 30px; margin: 0; padding: 0; border: 0; border-radius: 4px; overflow: hidden; background: #000; cursor: pointer; }
.strip button img { display: block; width: 100%; height: 100%; }
.strip button .left { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.6); color: #fff; font: 700 11px/1 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.strip button .by { position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; border: 1px solid #0ac8b9; background: #0a1428; color: #f0e6d2; display: grid; place-items: center; font: 700 8px/1 Georgia, serif; }

.ghost { position: absolute; transform: translate(-50%, -50%); }
.ghost img { display: block; width: 100%; height: 100%; box-sizing: border-box; border-radius: 50%; border: 2px solid #9aa0a6; object-fit: cover; filter: grayscale(1); opacity: 0.33; }
.ghost span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); color: #c4c4c4; font: 700 10px/1 'Segoe UI', system-ui, sans-serif; white-space: nowrap; }
.cpics .lvl { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #010a13; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
/* while you're dead: the tips for your lane (tips) and a teammate's screen (cam); and the next item to buy (buy) */

.tips ul { margin: 4px 0 0; padding-left: 18px; }
.tips li { margin: 3px 0; }

.buy img { flex: none; width: 22px; height: 22px; border-radius: 3px; }
.cam { display: grid; gap: 4px; padding: 6px; }

button { -webkit-app-region: no-drag; margin-left: 8px; padding: 3px 10px; border: 1px solid var(--gold); border-radius: 4px; background: var(--accent); color: var(--accent-fg); font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
