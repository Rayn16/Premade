<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premade overlay</title>
<style>
/* League's gold and dark blue, or the app's theme when index.html sends it (theme) */
:root { --bg: #010a13; --panel: #0a1428; --raised: #0f1e35; --fg: #f0e6d2; --muted: #a09b8c; --gold: #c8aa6e; --gold-line: #785a28; --accent: #0ac8b9; --accent-fg: #010a13; --link: #0ac8b9; --talk: #0ac8b9; --good: #3ccf8e; --bad: #ff6b6b; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body.fade { opacity: 0 !important; transition: opacity 0.9s; } /* who's talking in other games, fading out once nobody talks */
body { font: 600 14px/1.2 'Segoe UI', system-ui, sans-serif; color: var(--fg); text-shadow: 0 1px 2px #000; user-select: none; }
#main { box-sizing: border-box; height: 100%; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
[data-pos="ml"] #main, [data-pos="mr"] #main { justify-content: center; }
[data-pos="mr"] #main { align-items: flex-end; }
.pill { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 3px 14px 3px 3px; border: 1px solid var(--gold-line); border-radius: 999px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pic { flex: none; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--talk); box-shadow: 0 0 10px var(--talk); color: var(--gold); font: 700 13px/1 Georgia, serif; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.enemy .pic { border-color: #ff5c5c; box-shadow: 0 0 10px #ff5c5c; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { padding: 5px 14px 5px 10px; border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.toast { max-width: 100%; box-sizing: border-box; padding: 6px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 90%, transparent); font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.chat b { color: var(--gold); margin-right: 6px; }
.swap { border-color: var(--accent); color: var(--link); font-weight: 600; }
.note { padding: 4px 12px; font-weight: 500; font-size: 13px; }
.game { border-color: var(--gold); font-variant-numeric: tabular-nums; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
/* Move it: a frame you can drag anywhere, with a sample of what shows in it */
body.edit { outline: 2px dashed var(--gold); outline-offset: -2px; background: color-mix(in srgb, var(--bg) 40%, transparent); -webkit-app-region: drag; cursor: move; }
.edit .toast { border-color: var(--gold); }
/* Everyone's rank (board, What's new 166-168): Premade's own loading screen over all of League's (load), or the same
   smaller in the middle in a game (Alt+V), clear of the score, abilities and minimap. Your team on top on the red side,
   at the bottom on the blue side. Sized by the screen's height (1em = 1vh), like League's own screens. Cards (A), rows
   (B) or your lane first (D). A stat's box (.pop) shows while the mouse is over it (CSS alone). */
body.board { font-size: calc(1vh * var(--k, 1)); }
.team { font-size: 0.8em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); } /* the toasts' heads */
.sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 0.9em; }
.board #main { display: block; padding: 0; }
.board .stack { position: absolute; z-index: 2; top: 1vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; }
.rb { position: absolute; left: 50%; top: 9vh; transform: translateX(-50%) scale(0.62); transform-origin: 50% 0; display: flex; flex-direction: column; gap: 1.6em; width: 172em; }
.rb.load { inset: 0; top: 0; transform: none; width: auto; padding: 6em 6.7em 2em; box-sizing: border-box; background: radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--raised) 70%, var(--bg)), var(--bg) 72%); gap: 2.2em; }
.rhead { display: flex; justify-content: space-between; font-size: 1.5em; color: var(--muted); }
.rhead b { color: var(--fg); }
.rb:not(.load) { padding: 1.6em; border-radius: 1.6em; background: color-mix(in srgb, var(--bg) 72%, transparent); }
.rb:not(.load) .rhead span:first-child { display: none; }
.rb .team { font-size: 1.5em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); margin-bottom: 0.6em; }
.rb .foes .team { color: var(--bad); }
.crow { display: flex; gap: 2.2em; }
.pc { position: relative; flex: 1; min-width: 0; height: 35em; box-sizing: border-box; border-radius: 1.3em; border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent); background: var(--raised); font-weight: 500; }
.pc.foe { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.pc.me { border: 2px solid var(--fg); box-shadow: 0 0 2em color-mix(in srgb, var(--fg) 45%, transparent); }
.pc > .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; border-radius: inherit; }
.pc .chipx { position: absolute; top: 0.9em; left: 0.9em; padding: 0.25em 0.9em; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: 1.2em; font-weight: 700; text-shadow: none; }
.pc .sp { position: absolute; top: 0.9em; right: 0.9em; display: flex; gap: 0.45em; }
.sp img { width: 2.8em; height: 2.8em; border-radius: 0.5em; border: 1px solid #0009; }
.pc .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.8em 1.3em 1.3em; border-radius: 0 0 1.3em 1.3em; background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 94%, transparent) 26%); display: grid; gap: 0.45em; }
.rb .who { display: flex; align-items: baseline; gap: 0.7em; white-space: nowrap; min-width: 0; }
.rb .who b { font-size: 1.75em; overflow: hidden; text-overflow: ellipsis; }
.rb .sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 1.3em; }
.rb .rk { display: flex; align-items: center; gap: 0.6em; font-size: 1.45em; font-weight: 600; }
.rb .rk img { width: 1.7em; height: 1.7em; object-fit: contain; }
.rb .ch { font-size: 1.3em; }
.st3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55em; }
.st { position: relative; display: flex; align-items: center; gap: 0.45em; min-width: 0; padding: 0.35em 0.45em; border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent); border-radius: 0.75em; background: color-mix(in srgb, var(--bg) 60%, transparent); }
.st.off { border-color: color-mix(in srgb, var(--bad) 70%, transparent); }
.st.off .lb { color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.st svg { flex: none; width: 2.8em; height: 2.8em; }
.st > span { display: grid; min-width: 0; line-height: 1.2; }
.lb { font-size: 1em; color: var(--muted); }
.vl { font-size: 1.1em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop { display: none; position: absolute; z-index: 5; left: 0; bottom: calc(100% + 0.6em); width: 40em; max-height: 60vh; overflow: hidden; padding: 0.8em 1.1em; border: 1px solid var(--gold-line); border-radius: 0.8em; background: var(--panel); font-size: 1.2em; font-weight: 500; text-shadow: none; }
.st:nth-child(3) .pop { left: auto; right: 0; }
.st:hover .pop { display: grid; gap: 0.3em; }
.pop b { font-size: 1.1em; color: var(--gold); }
.rb .chips { display: flex; flex-wrap: wrap; gap: 0.4em; }
.rb .chip { padding: 0.1em 0.8em; border: 1px solid #6b6a66; border-radius: 999px; font-size: 1.2em; white-space: nowrap; }
.rb .chip.good { border-color: var(--good); color: color-mix(in srgb, var(--good) 60%, var(--fg)); }
.rb .chip.bad { border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.tipband { display: flex; align-items: center; gap: 2.6em; padding: 0.9em 1.9em; border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); border-radius: 1.1em; background: color-mix(in srgb, var(--panel) 88%, transparent); font-size: 1.4em; }
.tipband b { flex: none; text-transform: uppercase; letter-spacing: 0.06em; }
.tipband span { flex: 1; }
/* B, rows: a row per player */
.rows .pc { flex: none; height: auto; display: grid; grid-template-columns: 6em 6.5em 20em 19em minmax(0, 1fr) 44em 26em; align-items: center; gap: 1.2em; padding: 0.6em 1em; background: color-mix(in srgb, var(--panel) 92%, transparent); }
.rows .crow { flex-direction: column; gap: 0.6em; }
.rows .pc > .art { position: static; width: 6em; height: 6em; border-radius: 0.7em; object-position: 50% 15%; }
.rows .pc .chipx { top: -0.5em; left: -0.5em; font-size: 1em; }
.rows .pc .sp { position: static; grid-column: 2; }
.rows .pc .info { display: contents; }
.rows .who { grid-column: 3; } .rows .rk { grid-column: 4; } .rows .ch { grid-column: 5; } .rows .st3 { grid-column: 6; } .rows .chips { grid-column: 7; }
/* D, your lane first: you and your lane opponent big in the middle with the tips, the others small above and below */
.lane .small .pc { height: 18em; }
.lane .small .ch { display: none; }
.lane .mid { display: flex; gap: 2.2em; align-items: stretch; }
.lane .mid .pc { flex: none; width: 40em; height: 38em; }
.lane .mid .tipband { flex: 1; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1em; }
/* The whole screen (full): the rest sits where the small window would be (place), and a part with a place of its own
   (part: the Overlay page's layout) where it was put, growing away from the screen's nearest edges */
.full #main { position: absolute; width: 300px; height: 360px; overflow: hidden; transform-origin: 0 0; }
.grp { display: flex; flex-direction: column; align-items: inherit; gap: 6px; max-width: 100%; }
.part { position: absolute; width: max-content; max-width: 340px; }
/* the other team off your minimap (missing): a row each, with how long since they were seen and where they were heading */
.miss { display: grid; grid-template-columns: auto auto auto auto; align-items: center; gap: 4px 8px; padding: 6px 10px; }
.miss .team { grid-column: 1 / -1; font-size: 11px; }
.mrow { display: contents; }
.miss .pic { width: 22px; height: 22px; border-color: #ff5c5c; box-shadow: none; font-size: 11px; }
.mt { font-variant-numeric: tabular-nums; text-align: right; }
.miss .sub { font-size: 13px; }
/* TFT's item recipes (tft): the components along the top and side and what each pair makes, gold rings on the items
   your comp wants */
.rec { display: grid; gap: 2px; padding: 6px; }
.rec img { width: 20px; height: 20px; border-radius: 3px; }
.rec img.want { outline: 2px solid var(--gold); outline-offset: -1px; box-shadow: 0 0 6px var(--gold); }
/* on TFT's augment cards (cards): how you placed with each, at the foot of the card, sized by the screen like the cards */
.augc { position: absolute; transform: translate(-50%, -50%); max-width: 17vw; padding: 0.35em 0.9em; border-radius: 999px; font-size: 1.6vh; text-align: center; }
.augc.good { border-color: var(--good); }
.augc.bad { border-color: var(--bad); }
/* ARAM: Mayhem has its own transparent full-screen layer and card-specific rating layout. */
#mayhem { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.may-rate { position: absolute; transform: translate(-50%, -50%); max-width: 13vw; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; font-size: 1.35vh; text-align: center; text-shadow: 0 2px 4px #000, 0 0 2px #000; }
.may-rate.bar { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.35vh; white-space: normal; }
.may-rate.tier-only { width: 12vw; max-width: none; box-sizing: border-box; display: grid; justify-items: center; gap: 0.2vh; white-space: normal; }
.may-rate .augt { display: grid; justify-items: center; gap: 0.15vh; }
.may-rate .augp { white-space: nowrap; font: 700 2.1vh/1 Georgia, serif; color: var(--fg); font-variant-numeric: tabular-nums; }
.may-rate .augs { font-size: 1vh; color: var(--fg); text-align: center; }
.may-rate .augtrack { width: 100%; height: 0.6vh; border-radius: 999px; background: color-mix(in srgb, var(--fg) 12%, transparent); overflow: hidden; }
.may-rate .augfill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold-line), var(--gold)); transition: width 0.4s; }
.may-rate.good .augp { color: var(--gold); text-shadow: 0 0 1.2vh var(--gold), 0 2px 4px #000; }
.may-rate.good .augfill { background: linear-gradient(90deg, var(--gold), #f3dca0); box-shadow: 0 0 1vh var(--gold); }
.may-rate .augtag { justify-self: center; padding: 0; border: 0; border-radius: 0; font-size: 1.3vh; font-weight: 700; }
.may-rate .augtag.good { color: var(--good); }
.may-rate .augtag.bad { color: var(--bad); }
/* the card over League's end screen (after) */
.after { min-width: 220px; padding: 10px 14px; font-size: 15px; display: grid; gap: 4px; }
.after .team { font-size: 13px; }
.after.win { border-color: var(--good); }
.after.loss { border-color: var(--bad); }
.after button { justify-self: start; margin: 4px 0 0; }
/* The line at the top (the minimap reminder, the jungler callout): in the middle, fading in and out (on); first in the
   rest over everyone's rank */
.nudge { padding: 6px 16px 6px 12px; border-color: var(--gold); font-size: 15px; }
.nudge svg { width: 18px; height: 18px; stroke-linejoin: round; }
#call { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%) scale(var(--k, 1)); transform-origin: 50% 0; opacity: 0; transition: opacity 0.4s; }
#call.on { opacity: 1; }
body:not(.full) #call { display: none; }
/* a power spike as pictures (What's new 164): their champion and the item, or their champion and the level */
.cpics { display: flex; align-items: center; gap: 8px; }
.pill:not(.pics) .cpics, .pill.pics > svg, .pill.pics > span:last-child { display: none; }
.pill.pics { padding: 5px 7px; }
.cpics img { width: 36px; height: 36px; border-radius: 7px; }
.cpics img:first-child { border-radius: 50%; border: 2px solid var(--gold); box-sizing: border-box; }
.cpics .lvl { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #010a13; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
/* while you're dead: the tips for your lane (tips) and a teammate's screen (cam); and the next item to buy (buy) */
.tips { font-size: 13px; }
.tips ul { margin: 4px 0 0; padding-left: 18px; }
.tips li { margin: 3px 0; }
.buy { display: flex; align-items: center; gap: 8px; }
.buy img { flex: none; width: 22px; height: 22px; border-radius: 3px; }
.cam { display: grid; gap: 4px; padding: 6px; }
.cam img, .cam .ph { display: block; width: 320px; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 4px; background: #000; }
button { -webkit-app-region: no-drag; margin-left: 8px; padding: 3px 10px; border: 1px solid var(--gold); border-radius: 4px; background: var(--accent); color: var(--accent-fg); font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body data-pos="tl">
<div id="main"></div>
<div id="parts"></div>
<div id="mayhem" aria-hidden="true"></div>
<div id="call" class="pill nudge" data-part="call" role="status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span class="cpics"></span><span></span></div>
<script>
  // The Windows client's in-game overlay: a see-through window you can click through, over League in Borderless mode.
  // index.html fills it through the client with what the Overlay page picks: the objective timers, kills and gold
  // difference (game), your CS a minute (cs) and your CS and gold against your lane opponent (lane), in ARAM: Mayhem
  // your champion's best augments, else what kind suits it (aug), in TFT the item recipes (tft), in Practice Tool your key presses
  // and combo times and your jungle clear's camps (practice, app 1.15), your mic when it's
  // muted or you're talking, who can hear you, the effects on your voice, who's talking (a teal glow, red for the other
  // team), voice swap's countdown, room chat and the last popups, as see-through as the slider says (opacity). While
  // you move it (edit), it shows a frame and a sample. With board (app 1.10) it covers the screen with everyone's rank,
  // their record on their champion and tags, and the tips for your lane, and the rest goes at the top in the middle.
  // board: true covers the screen for the line at the top (call: what it says now, else ''; the minimap reminder or a
  // callout), which fades in and out in the middle while the rest stays where the small window would be, and for the
  // other team off your minimap (missing: [name, picture, how long, where]) and the card after a game (after).
  // It takes the app's theme colours (theme: Settings > Look, any but Light), else League's own.
  // Over the whole screen, parts (app 1.10) gives a part a place of its own (spot): the objective timers (game), your CS
  // and your lane (cs), TFT's item recipes (tft), Practice Tool's combos and camps (practice), your mic (me), who's
  // talking (talk), chat, popups (toasts), the line at the top (call), the other
  // team off your minimap (missing) and the card over League's end screen (after); the rest stay together. The Overlay
  // page shows this page in a frame, with what each part looks like (ovPreview), so you can place them.
  // While you're dead or in your base it can also show the next item to buy (buy: { name, pic, why }), and while you're
  // dead the tips for your lane (tips: { title, lines }) and a teammate's screen (screen: { name, img }, a JPEG picture
  // of it several times a second; the Overlay page sends no img and gets an empty frame). Your team's chance to win
  // comes at the end of the objective timers' line, and during a surrender vote also on a card of its own (vote: like
  // after's) beside League's vote box. While you pick an augment in TFT, cards puts on each augment card how you placed
  // with it ({ x, y: the middle of its foot, as shares of the screen; t: the words; k: good or bad }), and in ARAM: Mayhem
  // mayhemCards each card's tier over a DeepScore bar (p, s: its words, v: the bar 0-1; tierOnly: tier and score only;
  // k: good on the strongest, which glows; g: Reroll? on the weakest when it's C or D and not rerolled).
  const api = window.parent !== window ? window.parent.ovPreview : window.lpcClient;
  const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';
  const main = document.getElementById('main'), parts = document.getElementById('parts'), mayhemLayer = document.getElementById('mayhem'), call = document.getElementById('call');
  const el = (cls, text) => { const e = document.createElement('div'); e.className = cls; if (text) e.textContent = text; return e; };
  function pill(name, pic, team) {
    const p = el('pill' + (team === 'enemy' ? ' enemy' : '')), face = document.createElement('span'), n = document.createElement('span');
    face.className = 'pic';
    if (pic) { const img = new Image(); img.alt = ''; img.src = pic; face.append(img); } else face.textContent = name.slice(0, 1).toUpperCase();
    n.className = 'name';
    n.textContent = name;
    p.append(face, n);
    return p;
  }
  // ---- Everyone's rank (board): see the CSS above. A card: champion art in their skin (the base art when League
  // has no picture of it), You or Your lane, their spells, name, champion and role, rank with Riot's emblem, record on
  // the champion, the three stats and up to 2 tags (1 in a game). It's drawn again only when the board changes, so a
  // stat's box stays open while the rest of the overlay updates.
  const NS = 'http://www.w3.org/2000/svg';
  const ROLE_D = { TOP: 'M5 15V5h10', JUNGLE: 'M5 15l3-7 3 5 4-8', MIDDLE: 'M5 15 15 5', BOTTOM: 'M5 15h10V5', UTILITY: 'M10 15.5c-4-2.6-5.5-5.2-4.4-7.4 1-2 3.4-1.8 4.4.1 1-1.9 3.4-2.1 4.4-.1 1.1 2.2-.4 4.8-4.4 7.4z' };
  function svg(box, kids) {
    const s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', box);
    s.setAttribute('aria-hidden', 'true');
    for (const [tag, at, text] of kids) { const k = document.createElementNS(NS, tag); for (const [n, v] of Object.entries(at)) k.setAttribute(n, v); if (text) k.textContent = text; s.append(k); }
    return s;
  }
  function ring(x) { // won and lost as a ring: green at 55% or more, red at 45% or less
    const n = x ? x.w + x.l : 0, pc = n ? Math.round((100 * x.w) / n) : 0, c = !n ? 'none' : pc >= 55 ? 'var(--good)' : pc <= 45 ? 'var(--bad)' : 'var(--fg)';
    return svg('0 0 36 36', [['circle', { cx: 18, cy: 18, r: 15, fill: 'none', stroke: 'color-mix(in srgb, var(--fg) 15%, transparent)', 'stroke-width': 4 }],
      ['circle', { cx: 18, cy: 18, r: 15, fill: 'none', stroke: c, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-dasharray': `${(pc * 0.9425).toFixed(1)} 94.25`, transform: 'rotate(-90 18 18)' }],
      ['text', { x: 18, y: 22, 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 700, fill: 'currentColor', stroke: 'none' }, n ? pc + '%' : '']]);
  }
  function stat(cls, pic, label, value, head, lines) {
    const c = el('st' + cls), t = document.createElement('span');
    t.append(el('lb', label), el('vl', value));
    c.append(pic, t);
    if (Array.isArray(lines) && lines.length) { const box = el('pop'), b = document.createElement('b'); b.textContent = head; box.append(b, ...lines.slice(0, 20).map((x) => el('', String(x)))); c.append(box); }
    return c;
  }
  function stats(x) { // { l20, role, sea }: each null when hidden or unranked
    const row = el('st3'), { l20, role, sea } = x, wl = (v) => `${v.w | 0}W ${v.l | 0}L`;
    const icon = svg('0 0 20 20', [['rect', { x: 1.5, y: 1.5, width: 17, height: 17, rx: 3, fill: 'none', stroke: 'currentColor', 'stroke-opacity': 0.35 }], ['path', { d: (role && ROLE_D[role.pos]) || '', fill: 'none', stroke: role && role.off ? 'var(--bad)' : 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }]]);
    row.append(stat('', ring(l20), 'Last 20', l20 ? wl(l20) : 'Hidden', l20 && `Last 20 games · ${wl(l20)}`, l20 && l20.lines),
      stat(role && role.off ? ' off' : '', icon, 'Main role', role ? String(role.name) : 'Hidden', role && `Main role: ${role.name}`, role && role.lines),
      stat('', ring(sea), 'Season', sea ? wl(sea) : 'Unranked', sea && `This season · ${wl(sea)}`, sea && sea.lines));
    return row;
  }
  function card(p, n) { // n: how many tags
    const c = el('pc' + (p.ally ? '' : ' foe') + (p.me ? ' me' : '')), info = el('info'), who = el('who'), b = document.createElement('b'), sp = el('sp');
    if (p.art || p.pic) {
      const art = Object.assign(new Image(), { className: 'art', alt: '', src: String(p.art || p.pic) });
      art.onerror = () => { if (/_[1-9]\d*\.jpg$/.test(art.src)) art.src = art.src.replace(/_\d+\.jpg$/, '_0.jpg'); else if (p.pic && art.src !== p.pic) art.src = String(p.pic); };
      c.append(art);
    }
    if (p.me || p.lane) c.append(el('chipx', p.me ? 'You' : 'Your lane'));
    for (const x of Array.isArray(p.spells) ? p.spells.slice(0, 2) : []) sp.append(Object.assign(new Image(), { src: String(x), alt: '' }));
    b.textContent = String(p.name || '');
    who.append(b, el('sub', String(p.sub || '')));
    const rk = el('rk');
    if (p.emb) rk.append(Object.assign(new Image(), { src: String(p.emb), alt: '' }));
    const r = el('', String(p.rank || ''));
    if (/^#[0-9a-f]{6}$/i.test(p.tc || '')) r.style.color = p.tc;
    rk.append(r);
    const chips = el('chips');
    for (const [k, t] of (Array.isArray(p.tags) ? p.tags : []).slice(0, n)) chips.append(el('chip' + (k === 'good' || k === 'bad' ? ' ' + k : ''), String(t)));
    info.append(who, rk, ...(p.rec ? [el('ch', String(p.rec))] : []), ...(p.stats && typeof p.stats === 'object' ? [stats(p.stats)] : []), chips);
    c.append(sp, info);
    return c;
  }
  function team(head, list, ally, n) {
    const t = el(ally ? 'tm' : 'tm foes'), row = el('crow');
    row.append(...list.map((p) => card(p, n)));
    t.append(el('team', head), row);
    return t;
  }
  function tipband(t) {
    const band = el('tipband'), b = document.createElement('b');
    b.textContent = `Tips: ${t.title}`;
    band.append(b, ...t.lines.slice(0, 3).map((x) => el('', String(x))));
    return band;
  }
  let boardKey = '', boardEl = null;
  function board(b) {
    const k = JSON.stringify(b);
    if (k === boardKey && boardEl) return boardEl;
    const look = b.look === 'rows' || b.look === 'lane' ? b.look : 'cards', red = b.side === 'red', n = b.load ? 2 : 1;
    const us = Array.isArray(b.us) ? b.us : [], them = Array.isArray(b.them) ? b.them : [], heads = Array.isArray(b.heads) ? b.heads.map(String) : ['Your team', 'Their team'];
    const tips = b.tips && Array.isArray(b.tips.lines) && b.tips.lines.length ? tipband(b.tips) : null;
    const box = el(`rb ${look}${b.load ? ' load' : ''}`), head = el('rhead'), side = document.createElement('b');
    side.textContent = red ? 'Red side: your team is on top' : 'Blue side: your team is at the bottom';
    head.append(el('', String(b.title || '')), side);
    box.append(head);
    if (look === 'lane') { // you and your lane opponent(s) in the middle, the rest above and below
      const big = (p) => p.me || p.lane, mid = el('mid');
      mid.append(...[...us, ...them].filter(big).map((p) => card(p, n)), ...(tips ? [tips] : []));
      const top = red ? [heads[0], us.filter((p) => !big(p)), true] : [heads[1], them.filter((p) => !big(p)), false], bot = red ? [heads[1], them.filter((p) => !big(p)), false] : [heads[0], us.filter((p) => !big(p)), true];
      const small = (t) => { const x = team(t[0], t[1], t[2], 1); x.classList.add('small'); return x; };
      box.append(small(top), mid, small(bot));
    } else {
      const a = team(heads[0], us, true, n), z = team(heads[1], them, false, n);
      box.append(...(red ? [a] : [z]), ...(tips ? [tips] : []), ...(red ? [z] : [a]));
    }
    boardKey = k;
    return (boardEl = box);
  }
  // where the small window would be (client/main.js): 16 px in from the left or right, at the top or in the middle, or
  // where it was dragged (box: fractions of the screen), on the screen
  function place(s, k) {
    const W = innerWidth, H = innerHeight, w = 300 * k, h = 360 * k, b = s.pos === 'custom' && s.box && Number.isFinite(s.box.x) && Number.isFinite(s.box.y) ? s.box : null;
    const x = b ? b.x * W : s.pos === 'mr' ? W - w - 16 : 16, y = b ? b.y * H : s.pos === 'ml' || s.pos === 'mr' ? (H - h) / 2 : 16;
    return `left: ${Math.round(Math.min(Math.max(x, 0), W - w))}px; top: ${Math.round(Math.min(Math.max(y, 0), H - h))}px; transform: scale(${k})`;
  }
  // where a part with a place of its own goes: p.x and p.y are the corner or middle it hangs from, as shares of the
  // screen (ax: l, c or r; ay: t or b), and p.k its size, else the rest's
  function spot(p, k) {
    const ax = p.ax === 'r' || p.ax === 'c' ? p.ax : 'l', ay = p.ay === 'b' ? 'b' : 't', x = Math.min(1, Math.max(0, +p.x)), y = Math.min(1, Math.max(0, +p.y));
    return `${ax === 'r' ? `left: auto; right: ${100 - x * 100}%` : `left: ${x * 100}%; right: auto`}; ${ay === 'b' ? `top: auto; bottom: ${100 - y * 100}%` : `top: ${y * 100}%; bottom: auto`}; `
      + `transform: ${ax === 'c' ? 'translateX(-50%) ' : ''}scale(${Math.min(2.5, Math.max(0.5, +p.k || k))}); transform-origin: ${{ l: 0, c: 50, r: 100 }[ax]}% ${ay === 'b' ? 100 : 0}%; align-items: ${{ l: 'flex-start', c: 'center', r: 'flex-end' }[ax]}`;
  }
  const ok = (p) => !!p && typeof p === 'object' && Number.isFinite(+p.x) && Number.isFinite(+p.y);
  function missing(rows) { // [name, picture, how long, where]
    const box = el('toast miss');
    box.append(el('team', 'Off your minimap'));
    for (const [name, pic, time, where] of rows) {
      const r = pill(String(name), pic, 'enemy');
      r.className = 'mrow';
      r.append(el('mt', String(time || '')), el('sub', String(where || '')));
      box.append(r);
    }
    return box;
  }
  function recipes(t) { // { c: [[name, picture]], g: a row for each, [name, picture, wanted] or 0 }
    const box = el('toast rec'), pic = (x) => { if (!Array.isArray(x)) return el(''); const i = new Image(); i.alt = ''; i.title = String(x[0] || ''); i.src = String(x[1] || ''); if (x[2]) i.className = 'want'; return i; };
    box.style.gridTemplateColumns = `repeat(${t.c.length + 1}, 20px)`;
    box.append(el(''), ...t.c.map(pic));
    t.g.forEach((row, i) => box.append(pic(t.c[i]), ...(Array.isArray(row) ? row : []).map(pic)));
    return box;
  }
  function buy(b) { // the next item, with its picture
    const t = el('toast buy');
    if (b.pic) t.append(Object.assign(new Image(), { src: String(b.pic), alt: '' }));
    t.append(`Next: ${b.name}${b.why ? ` · ${b.why}` : ''}`);
    return t;
  }
  function tips(t) {
    const box = el('toast tips'), ul = document.createElement('ul');
    ul.append(...t.lines.map((x) => Object.assign(document.createElement('li'), { textContent: String(x) })));
    box.append(el('team', `Tips: ${t.title}`), ul);
    return box;
  }
  const camImg = Object.assign(new Image(), { alt: '' }); // kept, so each new picture takes the last one's place without a blank between
  function cam(c) {
    if (c.img && camImg.getAttribute('src') !== c.img) camImg.src = String(c.img);
    const box = el('toast cam');
    box.append(el('team', `${c.name}’s screen`), c.img ? camImg : el('ph'));
    return box;
  }
  function after(a) { // { title, win, lines, board: a Scoreboard button (What's new 169) }
    const c = el('toast after' + (a.win === true ? ' win' : a.win === false ? ' loss' : ''));
    c.append(el('team', String(a.title || '')), ...(Array.isArray(a.lines) ? a.lines : []).map((t) => el('', String(t))));
    if (a.board && api.overlayProg) {
      const b = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Scoreboard' });
      b.dataset.take = '';
      b.onclick = () => api.overlayProg({ id: 'after', go: 'scoreboard' });
      c.append(b);
    }
    return c;
  }
  // The mouse goes through to the game, but the page hears it move (prog): over a button it takes the mouse so the
  // button can be clicked, and gives it back once the mouse leaves or the button is gone. One listener, set once.
  let taking = false;
  const take = (on) => { if (on !== taking) { taking = on; if (api.overlayMouse) api.overlayMouse(on); } };
  addEventListener('mousemove', (e) => take(!!(e.target.closest && e.target.closest('[data-take]'))));
  const THEME = ['bg', 'panel', 'raised', 'fg', 'muted', 'gold', 'gold-line', 'accent', 'accent-fg', 'link', 'talk', 'good', 'bad'];
  let lastOverlayState = null;
  const renderOverlay = (s) => {
    if (!s.visible) { call.classList.remove('on'); parts.replaceChildren(); mayhemLayer.replaceChildren(); main.replaceChildren(); take(false); return; }
    const t = s.theme || {}; // a colour for each, or League's (an empty value takes the page's own back)
    for (const k of THEME) document.documentElement.style.setProperty('--' + k, typeof t[k] === 'string' && CSS.supports('color', t[k]) ? t[k] : '');
    const full = s.board === true, players = !!s.board && !full;
    const k = Math.min(players ? 1 : 2, Math.max(0.7, +s.scale || 1), innerWidth / 300, innerHeight / 360);
    const spots = s.parts && typeof s.parts === 'object' ? s.parts : {};
    document.body.dataset.pos = s.pos === 'mr' || s.pos === 'ml' ? s.pos : 'tl';
    document.body.classList.toggle('board', players);
    document.body.classList.toggle('full', full);
    document.body.style.zoom = s.board ? 1 : k;
    document.body.style.setProperty('--k', k);
    document.body.style.opacity = s.edit ? 1 : Math.min(1, Math.max(0.2, +s.opacity || 1));
    document.body.classList.toggle('edit', !!s.edit);
    document.body.classList.toggle('fade', !!s.fade);
    main.style.cssText = full ? place(s, k) : '';
    call.style.cssText = full && ok(spots.call) ? spot(spots.call, k) : '';
    if (s.call) { // kept while it fades out; pictures instead of the words when it has them (callPics), the words for screen readers
      call.lastChild.textContent = s.call;
      call.setAttribute('aria-label', s.call);
      const P = Array.isArray(s.callPics) && s.callPics.every((x) => typeof x === 'string') ? s.callPics : null, pk = JSON.stringify(P);
      if (call.dataset.pics !== pk) {
        call.dataset.pics = pk;
        call.querySelector('.cpics').replaceChildren(...(P || []).map((x) => (/^\d+$/.test(x) ? el('lvl', x) : /^https:\/\//.test(x) ? Object.assign(new Image(), { src: x, alt: '' }) : el('lvl', ''))));
        call.classList.toggle('pics', !!P);
      }
    }
    call.classList.toggle('on', full && !!s.call);
    const out = [], groups = {}, add = (g, e) => { (groups[g] = groups[g] || []).push(e); };
    if (s.call && !full) { const n = call.cloneNode(true); n.removeAttribute('id'); n.style.cssText = ''; out.push(n); }
    if (s.edit) {
      const hint = el('toast', 'Drag this where you want it');
      const done = document.createElement('button');
      done.textContent = 'Done';
      done.onclick = () => api.overlayDone();
      hint.append(done);
      out.push(hint);
      if (!(s.talkers || []).length) out.push(pill('A friend talking', '', ''));
    }
    if (s.game) add('game', el('toast game', String(s.game)));
    if (s.aug) add('game', el('toast', String(s.aug)));
    if (s.cs) add('cs', el('toast game', String(s.cs)));
    if (s.lane) add('cs', el('toast game', String(s.lane)));
    if (s.tft && Array.isArray(s.tft.c) && Array.isArray(s.tft.g)) add('tft', recipes(s.tft));
    if (s.buy && typeof s.buy === 'object') add('buy', buy(s.buy));
    for (const t of Array.isArray(s.practice) ? s.practice : []) add('practice', el('toast game', String(t)));
    if (s.muted) {
      const m = el('pill muted');
      m.innerHTML = MIC + '<path d="M4 4l16 16"/></svg>';
      m.append('You’re muted');
      add('me', m);
    } else if (s.talking) {
      const you = pill('You', '', '');
      you.firstChild.innerHTML = MIC + '</svg>';
      add('me', you);
    }
    if (s.hear) add('me', el('pill note', s.hear.length ? `Heard by ${s.hear.join(', ')}` : 'No teammate can hear you'));
    if (s.fx && s.fx.length) add('me', el('pill note', `Your voice: ${s.fx.join(', ')}`));
    for (const t of s.talkers || []) add('talk', pill(String(t.name), t.pic, t.team));
    if (s.swapIn) add('talk', el('toast swap', `Voices swap in ${s.swapIn}…`));
    for (const c of s.chat || []) {
      const m = el('toast chat'), b = document.createElement('b');
      b.textContent = String(c.name);
      m.append(b, String(c.text));
      add('chat', m);
    }
    for (const t of s.toasts || []) add('toasts', el('toast', String(t)));
    if (Array.isArray(s.missing) && s.missing.length) add('missing', missing(s.missing));
    if (s.after && typeof s.after === 'object') add('after', after(s.after));
    if (s.vote && typeof s.vote === 'object') add('vote', after(s.vote));
    if (s.tips && Array.isArray(s.tips.lines)) add('tips', tips(s.tips));
    if (s.screen && typeof s.screen === 'object') add('screen', cam(s.screen));
    const own = [];
    for (const [g, list] of Object.entries(groups)) {
      const box = el('grp'), p = ok(spots[g]) && spots[g];
      box.dataset.part = g;
      box.append(...list);
      if (p && full) { box.classList.add('part'); box.style.cssText = spot(p, k); own.push(box); }
      else if (!(p && s.edit)) out.push(box); // while you move the rest, only the rest
    }
    const cards = full && Array.isArray(s.cards) ? s.cards.filter(ok).map((c) => {
      const k = c.k === 'good' || c.k === 'bad' ? ' ' + c.k : '', v = +c.v, bar = Number.isFinite(v);
      const b = el('toast augc' + (bar ? ' bar' : '') + k, bar ? '' : String(c.t || ''));
      if (bar) {
        const top = el('augt'), track = el('augtrack'), fill = el('augfill');
        top.append(el('augp', String(c.p || '')), el('augs', String(c.s || '')));
        fill.style.width = `${Math.min(1, Math.max(0, v)) * 100}%`;
        track.append(fill);
        b.append(top, track, ...(c.g ? [el('augtag' + (c.gk === 'good' || c.gk === 'bad' ? ' ' + c.gk : ''), String(c.g))] : []));
        b.title = String(c.t || '');
      }
      b.style.left = `${Math.min(1, Math.max(0, +c.x)) * 100}%`;
      b.style.top = `${Math.min(1, Math.max(0, +c.y)) * 100}%`;
      return b;
    }) : [];
    const mayCards = full && Array.isArray(s.mayhemCards) ? s.mayhemCards.filter(ok).map((c) => {
      const k = c.k === 'good' || c.k === 'bad' ? ' ' + c.k : '', v = +c.v, tierOnly = c.tierOnly === true, bar = !tierOnly && Number.isFinite(v);
      const b = el('may-rate' + (bar ? ' bar' : tierOnly ? ' tier-only' : '') + k, bar || tierOnly ? '' : String(c.t || ''));
      if (bar || tierOnly) {
        const top = el('augt'), track = el('augtrack'), fill = el('augfill');
        top.append(el('augp', tierOnly ? `Tier ${c.tier || '?'}` : String(c.p || '')), el('augs', tierOnly ? `${c.score ?? ''} DeepScore` : String(c.s || '')));
        if (bar) { fill.style.width = `${Math.min(1, Math.max(0, v)) * 100}%`; track.append(fill); }
        b.append(...(bar ? [track] : []), top, ...(c.g ? [el('augtag' + (c.gk === 'good' || c.gk === 'bad' ? ' ' + c.gk : ''), String(c.g))] : []));
        b.title = String(c.t || '');
      }
      b.style.left = `${Math.min(1, Math.max(0, +c.x)) * 100}%`;
      b.style.top = `${Math.min(1, Math.max(0, +c.y)) * 100}%`;
      return b;
    }) : [];
    parts.replaceChildren(...own, ...cards);
    mayhemLayer.replaceChildren(...mayCards);
    if (players) { const stack = el('stack'); stack.append(...out); main.replaceChildren(stack, board(s.board)); } else main.replaceChildren(...out);
    if (taking && !document.querySelector('[data-take]')) take(false);
  };
  api.on('overlay', (s) => { lastOverlayState = s; renderOverlay(s); });
  addEventListener('resize', () => { if (lastOverlayState && lastOverlayState.visible) renderOverlay(lastOverlayState); });
</script>
