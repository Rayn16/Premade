<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Premade overlay</title>
<style>
/* League's gold and dark blue, or the app's theme when index.html sends it (theme) */
:root { --bg: #010a13; --panel: #0a1428; --raised: #0f1e35; --fg: #f0e6d2; --muted: #a09b8c; --gold: #c8aa6e; --gold-line: #785a28; --accent: #0ac8b9; --accent-fg: #010a13; --link: #0ac8b9; --talk: #0ac8b9; --good: #3ccf8e; --bad: #ff6b6b; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
body { font: 600 14px/1.2 'Segoe UI', system-ui, sans-serif; color: var(--fg); text-shadow: 0 1px 2px #000; user-select: none; }
#main { box-sizing: border-box; height: 100%; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
[data-pos="ml"] #main, [data-pos="mr"] #main { justify-content: center; }
[data-pos="mr"] #main { align-items: flex-end; }
.pill { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 3px 14px 3px 3px; border: 1px solid var(--gold-line); border-radius: 999px; background: color-mix(in srgb, var(--bg) 85%, transparent); }
.pic { flex: none; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--raised); border: 2px solid var(--talk); box-shadow: 0 0 10px var(--talk); color: var(--gold); font: 700 13px/1 Georgia, serif; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.enemy .pic { border-color: #ff5c5c; box-shadow: 0 0 10px #ff5c5c; }
.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { padding: 5px 14px 5px 10px; border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.toast { max-width: 100%; box-sizing: border-box; padding: 6px 12px; border: 1px solid var(--gold-line); border-radius: 6px; background: color-mix(in srgb, var(--panel) 90%, transparent); font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.chat b { color: var(--gold); margin-right: 6px; }
.swap { border-color: var(--accent); color: var(--link); font-weight: 600; }
.note { padding: 4px 12px; font-weight: 500; font-size: 13px; }
.game { border-color: var(--gold); font-variant-numeric: tabular-nums; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
/* Move it: a frame you can drag anywhere, with a sample of what shows in it */
body.edit { outline: 2px dashed var(--gold); outline-offset: -2px; background: color-mix(in srgb, var(--bg) 40%, transparent); -webkit-app-region: drag; cursor: move; }
.edit .toast { border-color: var(--gold); }
/* Everyone's rank (board): the whole screen, over League's loading screen. Your team on the left in the top half and
   theirs in the bottom half, the tips for your lane on the right, the middle left to League. Sized by the screen's
   height, like League's own screens; a half cuts off what doesn't fit rather than run into the other. */
body.board { font-size: calc(1.25vh * var(--k, 1)); }
.board #main { display: block; padding: 0; }
.board .stack { position: absolute; top: 1vh; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; }
.side { position: absolute; top: 1.2vh; bottom: 1.2vh; left: 0.6vw; width: calc(36vh * var(--k, 1)); display: flex; flex-direction: column; gap: 1.2vh; }
.half { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 0.35em; }
.team { font-size: 0.8em; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
.card { flex: none; display: flex; align-items: flex-start; gap: 0.5em; padding: 0.35em 0.5em; border: 1px solid var(--gold-line); border-radius: 0.45em; background: color-mix(in srgb, var(--bg) 88%, transparent); font-weight: 500; }
.card.me { border-color: var(--fg); box-shadow: 0 0 0.5em color-mix(in srgb, var(--gold) 70%, transparent); }
.card .pic { width: 2.4em; height: 2.4em; margin-top: 0.1em; font-size: 1em; }
.card > div { flex: 1; min-width: 0; }
.card .emb { flex: none; width: 2.6em; height: 2.6em; align-self: center; object-fit: contain; } /* Riot's emblem for their rank */
.who { display: flex; align-items: baseline; gap: 0.4em; white-space: nowrap; }
.who b { overflow: hidden; text-overflow: ellipsis; }
.sub { overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 0.9em; }
.lane { margin-left: auto; padding: 0 0.4em; border-radius: 0.3em; background: var(--gold); color: var(--bg); font-size: 0.8em; font-weight: 700; text-shadow: none; }
.rk { font-weight: 600; }
.ch { color: color-mix(in srgb, var(--gold) 70%, var(--fg)); font-size: 0.92em; }
.chips { display: flex; flex-wrap: wrap; gap: 0.2em 0.3em; margin-top: 0.2em; }
.chip { padding: 0 0.45em; border: 1px solid #5b5a56; border-radius: 999px; font-size: 0.85em; white-space: nowrap; }
.chip.good { border-color: var(--good); color: color-mix(in srgb, var(--good) 60%, var(--fg)); }
.chip.bad { border-color: var(--bad); color: color-mix(in srgb, var(--bad) 55%, var(--fg)); }
.tipcol { position: absolute; top: 1.2vh; right: 0.6vw; width: calc(36vh * var(--k, 1)); max-height: 97.6vh; overflow: hidden; }
.tipcol ul { margin: 0.35em 0 0; padding: 0.5em 0.7em 0.5em 1.7em; border: 1px solid var(--gold-line); border-radius: 0.45em; background: color-mix(in srgb, var(--bg) 88%, transparent); font-weight: 500; }
.tipcol li { margin: 0.3em 0; }
/* The whole screen (full): the rest sits where the small window would be (place), and a part with a place of its own
   (part: the Overlay page's layout) where it was put, growing away from the screen's nearest edges */
.full #main { position: absolute; width: 300px; height: 360px; overflow: hidden; transform-origin: 0 0; }
.grp { display: flex; flex-direction: column; align-items: inherit; gap: 6px; max-width: 100%; }
.part { position: absolute; width: max-content; max-width: 340px; }
/* the other team off your minimap (missing): a row each, with how long since they were seen and where they were heading */
.miss { display: grid; grid-template-columns: auto auto auto auto; align-items: center; gap: 4px 8px; padding: 6px 10px; }
.miss .team { grid-column: 1 / -1; font-size: 11px; }
.mrow { display: contents; }
.miss .pic { width: 22px; height: 22px; border-color: #ff5c5c; box-shadow: none; font-size: 11px; }
.mt { font-variant-numeric: tabular-nums; text-align: right; }
.miss .sub { font-size: 13px; }
/* TFT's item recipes (tft): the components along the top and side and what each pair makes, gold rings on the items
   your comp wants */
.rec { display: grid; gap: 2px; padding: 6px; }
.rec img { width: 20px; height: 20px; border-radius: 3px; }
.rec img.want { outline: 2px solid var(--gold); outline-offset: -1px; box-shadow: 0 0 6px var(--gold); }
/* the card over League's end screen (after) */
.after { min-width: 220px; padding: 10px 14px; font-size: 15px; display: grid; gap: 4px; }
.after .team { font-size: 13px; }
.after.win { border-color: var(--good); }
.after.loss { border-color: var(--bad); }
/* The line at the top (the minimap reminder, the jungler callout): in the middle, fading in and out (on); first in the
   rest over everyone's rank */
.nudge { padding: 6px 16px 6px 12px; border-color: var(--gold); font-size: 15px; }
.nudge svg { width: 18px; height: 18px; stroke-linejoin: round; }
#call { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%) scale(var(--k, 1)); transform-origin: 50% 0; opacity: 0; transition: opacity 0.4s; }
#call.on { opacity: 1; }
body:not(.full) #call { display: none; }
/* while you're dead: the tips for your lane (tips) and a teammate's screen (cam); and the next item to buy (buy) */
.tips { font-size: 13px; }
.tips ul { margin: 4px 0 0; padding-left: 18px; }
.tips li { margin: 3px 0; }
.buy { display: flex; align-items: center; gap: 8px; }
.buy img { flex: none; width: 22px; height: 22px; border-radius: 3px; }
.cam { display: grid; gap: 4px; padding: 6px; }
.cam img, .cam .ph { display: block; width: 320px; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 4px; background: #000; }
button { -webkit-app-region: no-drag; margin-left: 8px; padding: 3px 10px; border: 1px solid var(--gold); border-radius: 4px; background: var(--accent); color: var(--accent-fg); font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body data-pos="tl">
<div id="main"></div>
<div id="parts"></div>
<div id="call" class="pill nudge" data-part="call"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span></span></div>
<script>
  // The Windows client's in-game overlay: a see-through window you can click through, over League in Borderless mode.
  // index.html fills it through the client with what the Overlay page picks: the objective timers, kills and gold
  // difference (game), your CS a minute (cs) and your CS and gold against your lane opponent (lane), in ARAM: Mayhem
  // what kind of augment suits your champion (aug), in TFT the item recipes (tft), in Practice Tool your key presses
  // and combo times and your jungle clear's camps (practice, app 1.15), your mic when it's
  // muted or you're talking, who can hear you, the effects on your voice, who's talking (a teal glow, red for the other
  // team), voice swap's countdown, room chat and the last popups, as see-through as the slider says (opacity). While
  // you move it (edit), it shows a frame and a sample. With board (app 1.10) it covers the screen with everyone's rank,
  // their record on their champion and tags, and the tips for your lane, and the rest goes at the top in the middle.
  // board: true covers the screen for the line at the top (call: what it says now, else ''; the minimap reminder or a
  // callout), which fades in and out in the middle while the rest stays where the small window would be, and for the
  // other team off your minimap (missing: [name, picture, how long, where]) and the card after a game (after).
  // It takes the app's theme colours (theme: Settings > Look, any but Light), else League's own.
  // Over the whole screen, parts (app 1.10) gives a part a place of its own (spot): the objective timers (game), your CS
  // and your lane (cs), TFT's item recipes (tft), Practice Tool's combos and camps (practice), your mic (me), who's
  // talking (talk), chat, popups (toasts), the line at the top (call), the other
  // team off your minimap (missing) and the card over League's end screen (after); the rest stay together. The Overlay
  // page shows this page in a frame, with what each part looks like (ovPreview), so you can place them.
  // While you're dead or in your base it can also show the next item to buy (buy: { name, pic, why }), and while you're
  // dead the tips for your lane (tips: { title, lines }) and a teammate's screen (screen: { name, img }, a JPEG picture
  // of it several times a second; the Overlay page sends no img and gets an empty frame). Your team's chance to win
  // comes at the end of the objective timers' line.
  const api = window.parent !== window ? window.parent.ovPreview : window.lpcClient;
  const MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>';
  const main = document.getElementById('main'), parts = document.getElementById('parts'), call = document.getElementById('call');
  const el = (cls, text) => { const e = document.createElement('div'); e.className = cls; if (text) e.textContent = text; return e; };
  function pill(name, pic, team) {
    const p = el('pill' + (team === 'enemy' ? ' enemy' : '')), face = document.createElement('span'), n = document.createElement('span');
    face.className = 'pic';
    if (pic) { const img = new Image(); img.alt = ''; img.src = pic; face.append(img); } else face.textContent = name.slice(0, 1).toUpperCase();
    n.className = 'name';
    n.textContent = name;
    p.append(face, n);
    return p;
  }
  // a player on the board: champion picture, name, champion and role, rank (in its tier's color), their record on
  // the champion, tags (good ones green, bad ones red) and Riot's emblem for their rank
  function card(p) {
    const c = el('card' + (p.ally ? '' : ' enemy') + (p.me ? ' me' : '')), face = document.createElement('span'), text = el(''), who = el('who'), n = document.createElement('b');
    face.className = 'pic';
    if (p.pic) { const img = new Image(); img.alt = ''; img.src = p.pic; face.append(img); }
    n.textContent = String(p.name || '');
    who.append(n);
    if (p.sub) who.append(Object.assign(document.createElement('span'), { className: 'sub', textContent: String(p.sub) }));
    if (p.lane) who.append(Object.assign(document.createElement('span'), { className: 'lane', textContent: 'Your lane' }));
    const rk = el('rk', String(p.rank || ''));
    if (/^#[0-9a-f]{6}$/i.test(p.tc || '')) rk.style.color = p.tc;
    const chips = el('chips');
    for (const [k, t] of Array.isArray(p.tags) ? p.tags : []) chips.append(el('chip' + (k === 'good' || k === 'bad' ? ' ' + k : ''), String(t)));
    text.append(who, rk, ...(p.rec ? [el('ch', String(p.rec))] : []), chips);
    c.append(face, text);
    if (p.emb) c.append(Object.assign(new Image(), { src: String(p.emb), alt: '', className: 'emb' }));
    return c;
  }
  function board(b, out) {
    const half = (head, list) => { const h = el('half'); h.append(el('team', head), ...(Array.isArray(list) ? list : []).map(card)); return h; };
    const side = el('side'), parts = [side];
    const heads = Array.isArray(b.heads) ? b.heads : ['Your team', 'Their team']; // with each team's average rank, and which is favored
    side.append(half(String(heads[0]), b.us), half(String(heads[1]), b.them));
    if (b.tips && Array.isArray(b.tips.lines) && b.tips.lines.length) {
      const col = el('tipcol'), ul = document.createElement('ul');
      ul.append(...b.tips.lines.map((t) => Object.assign(document.createElement('li'), { textContent: String(t) })));
      col.append(el('team', `Tips: ${b.tips.title}`), ul);
      parts.push(col);
    }
    const stack = el('stack');
    stack.append(...out);
    return [stack, ...parts];
  }
  // where the small window would be (client/main.js): 16 px in from the left or right, at the top or in the middle, or
  // where it was dragged (box: fractions of the screen), on the screen
  function place(s, k) {
    const W = innerWidth, H = innerHeight, w = 300 * k, h = 360 * k, b = s.pos === 'custom' && s.box && Number.isFinite(s.box.x) && Number.isFinite(s.box.y) ? s.box : null;
    const x = b ? b.x * W : s.pos === 'mr' ? W - w - 16 : 16, y = b ? b.y * H : s.pos === 'ml' || s.pos === 'mr' ? (H - h) / 2 : 16;
    return `left: ${Math.round(Math.min(Math.max(x, 0), W - w))}px; top: ${Math.round(Math.min(Math.max(y, 0), H - h))}px; transform: scale(${k})`;
  }
  // where a part with a place of its own goes: p.x and p.y are the corner or middle it hangs from, as shares of the
  // screen (ax: l, c or r; ay: t or b), and p.k its size, else the rest's
  function spot(p, k) {
    const ax = p.ax === 'r' || p.ax === 'c' ? p.ax : 'l', ay = p.ay === 'b' ? 'b' : 't', x = Math.min(1, Math.max(0, +p.x)), y = Math.min(1, Math.max(0, +p.y));
    return `${ax === 'r' ? `left: auto; right: ${100 - x * 100}%` : `left: ${x * 100}%; right: auto`}; ${ay === 'b' ? `top: auto; bottom: ${100 - y * 100}%` : `top: ${y * 100}%; bottom: auto`}; `
      + `transform: ${ax === 'c' ? 'translateX(-50%) ' : ''}scale(${Math.min(2.5, Math.max(0.5, +p.k || k))}); transform-origin: ${{ l: 0, c: 50, r: 100 }[ax]}% ${ay === 'b' ? 100 : 0}%; align-items: ${{ l: 'flex-start', c: 'center', r: 'flex-end' }[ax]}`;
  }
  const ok = (p) => !!p && typeof p === 'object' && Number.isFinite(+p.x) && Number.isFinite(+p.y);
  function missing(rows) { // [name, picture, how long, where]
    const box = el('toast miss');
    box.append(el('team', 'Off your minimap'));
    for (const [name, pic, time, where] of rows) {
      const r = pill(String(name), pic, 'enemy');
      r.className = 'mrow';
      r.append(el('mt', String(time || '')), el('sub', String(where || '')));
      box.append(r);
    }
    return box;
  }
  function recipes(t) { // { c: [[name, picture]], g: a row for each, [name, picture, wanted] or 0 }
    const box = el('toast rec'), pic = (x) => { if (!Array.isArray(x)) return el(''); const i = new Image(); i.alt = ''; i.title = String(x[0] || ''); i.src = String(x[1] || ''); if (x[2]) i.className = 'want'; return i; };
    box.style.gridTemplateColumns = `repeat(${t.c.length + 1}, 20px)`;
    box.append(el(''), ...t.c.map(pic));
    t.g.forEach((row, i) => box.append(pic(t.c[i]), ...(Array.isArray(row) ? row : []).map(pic)));
    return box;
  }
  function buy(b) { // the next item, with its picture
    const t = el('toast buy');
    if (b.pic) t.append(Object.assign(new Image(), { src: String(b.pic), alt: '' }));
    t.append(`Next: ${b.name}${b.why ? ` · ${b.why}` : ''}`);
    return t;
  }
  function tips(t) {
    const box = el('toast tips'), ul = document.createElement('ul');
    ul.append(...t.lines.map((x) => Object.assign(document.createElement('li'), { textContent: String(x) })));
    box.append(el('team', `Tips: ${t.title}`), ul);
    return box;
  }
  const camImg = Object.assign(new Image(), { alt: '' }); // kept, so each new picture takes the last one's place without a blank between
  function cam(c) {
    if (c.img && camImg.getAttribute('src') !== c.img) camImg.src = String(c.img);
    const box = el('toast cam');
    box.append(el('team', `${c.name}’s screen`), c.img ? camImg : el('ph'));
    return box;
  }
  function after(a) { // { title, win, lines }
    const c = el('toast after' + (a.win === true ? ' win' : a.win === false ? ' loss' : ''));
    c.append(el('team', String(a.title || '')), ...(Array.isArray(a.lines) ? a.lines : []).map((t) => el('', String(t))));
    return c;
  }
  const THEME = ['bg', 'panel', 'raised', 'fg', 'muted', 'gold', 'gold-line', 'accent', 'accent-fg', 'link', 'talk', 'good', 'bad'];
  api.on('overlay', (s) => {
    if (!s.visible) { call.classList.remove('on'); parts.replaceChildren(); return main.replaceChildren(); }
    const t = s.theme || {}; // a colour for each, or League's (an empty value takes the page's own back)
    for (const k of THEME) document.documentElement.style.setProperty('--' + k, typeof t[k] === 'string' && CSS.supports('color', t[k]) ? t[k] : '');
    const full = s.board === true, players = !!s.board && !full, k = Math.min(players ? 1.2 : 2, Math.max(0.7, +s.scale || 1)); // the board fills the screen at 1.2
    const spots = s.parts && typeof s.parts === 'object' ? s.parts : {};
    document.body.dataset.pos = s.pos === 'mr' || s.pos === 'ml' ? s.pos : 'tl';
    document.body.classList.toggle('board', players);
    document.body.classList.toggle('full', full);
    document.body.style.zoom = s.board ? 1 : s.scale || 1;
    document.body.style.setProperty('--k', k);
    document.body.style.opacity = s.edit ? 1 : Math.min(1, Math.max(0.2, +s.opacity || 1));
    document.body.classList.toggle('edit', !!s.edit);
    main.style.cssText = full ? place(s, k) : '';
    call.style.cssText = full && ok(spots.call) ? spot(spots.call, k) : '';
    if (s.call) call.lastChild.textContent = s.call; // kept while it fades out
    call.classList.toggle('on', full && !!s.call);
    const out = [], groups = {}, add = (g, e) => { (groups[g] = groups[g] || []).push(e); };
    if (s.call && !full) { const n = call.cloneNode(true); n.removeAttribute('id'); n.style.cssText = ''; out.push(n); }
    if (s.edit) {
      const hint = el('toast', 'Drag this where you want it');
      const done = document.createElement('button');
      done.textContent = 'Done';
      done.onclick = () => api.overlayDone();
      hint.append(done);
      out.push(hint);
      if (!(s.talkers || []).length) out.push(pill('A friend talking', '', ''));
    }
    if (s.game) add('game', el('toast game', String(s.game)));
    if (s.aug) add('game', el('toast', String(s.aug)));
    if (s.cs) add('cs', el('toast game', String(s.cs)));
    if (s.lane) add('cs', el('toast game', String(s.lane)));
    if (s.tft && Array.isArray(s.tft.c) && Array.isArray(s.tft.g)) add('tft', recipes(s.tft));
    if (s.buy && typeof s.buy === 'object') add('buy', buy(s.buy));
    for (const t of Array.isArray(s.practice) ? s.practice : []) add('practice', el('toast game', String(t)));
    if (s.muted) {
      const m = el('pill muted');
      m.innerHTML = MIC + '<path d="M4 4l16 16"/></svg>';
      m.append('You’re muted');
      add('me', m);
    } else if (s.talking) {
      const you = pill('You', '', '');
      you.firstChild.innerHTML = MIC + '</svg>';
      add('me', you);
    }
    if (s.hear) add('me', el('pill note', s.hear.length ? `Heard by ${s.hear.join(', ')}` : 'No teammate can hear you'));
    if (s.fx && s.fx.length) add('me', el('pill note', `Your voice: ${s.fx.join(', ')}`));
    for (const t of s.talkers || []) add('talk', pill(String(t.name), t.pic, t.team));
    if (s.swapIn) add('talk', el('toast swap', `Voices swap in ${s.swapIn}…`));
    for (const c of s.chat || []) {
      const m = el('toast chat'), b = document.createElement('b');
      b.textContent = String(c.name);
      m.append(b, String(c.text));
      add('chat', m);
    }
    for (const t of s.toasts || []) add('toasts', el('toast', String(t)));
    if (Array.isArray(s.missing) && s.missing.length) add('missing', missing(s.missing));
    if (s.after && typeof s.after === 'object') add('after', after(s.after));
    if (s.tips && Array.isArray(s.tips.lines)) add('tips', tips(s.tips));
    if (s.screen && typeof s.screen === 'object') add('screen', cam(s.screen));
    const own = [];
    for (const [g, list] of Object.entries(groups)) {
      const box = el('grp'), p = ok(spots[g]) && spots[g];
      box.dataset.part = g;
      box.append(...list);
      if (p && full) { box.classList.add('part'); box.style.cssText = spot(p, k); own.push(box); }
      else if (!(p && s.edit)) out.push(box); // while you move the rest, only the rest
    }
    parts.replaceChildren(...own);
    main.replaceChildren(...(players ? board(s.board, out) : out));
  });
</script>
</body>
</html>
