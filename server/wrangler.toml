name = "league-proxchat"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[durable_objects.bindings]]
name = "RIOT"
class_name = "Riot"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Riot"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Directory"]

# wakes the Riot object's counting if it ever stopped, and runs the Aion 2 tracker's update (with the GH_TOKEN secret)
[triggers]
crons = ["*/30 * * * *"]
