# Builds the Windows app (installer, blockmap and latest.yml) from client/. Run it from the Actions tab, or push a
# tag like v1.8.0. The files are on the run's page under Artifacts.
name: Build the Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Premade-Setup
          path: |
            client/dist/Premade-Setup.exe
            client/dist/Premade-Setup.exe.blockmap
            client/dist/latest.yml
