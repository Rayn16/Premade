# TEMPORARY (removed in the next commit): the TFT Mayhem memory check on GitHub's Chromium 141, today's live
# version (4d525ad) against this branch, twice each, plus this branch with the sound engine never sleeping.
name: TFT memory A/B (temporary)
on:
  push:
    branches: [claude/project-thread-ypy88n]
    paths: ['.github/workflows/ab-tft.yml']
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - run: |
          git worktree add ../before 4d525ad2f1a6810afb34da9abaf985c4da10a5f3
          git worktree add ../nosleep HEAD
          sed -i '/ac.suspend().catch/d; /bell.suspend().catch/d' ../nosleep/site/index.html
          git -C ../nosleep diff --stat
      - run: |
          for i in 1 2; do for v in ../before . ../nosleep; do
            s=$(date +%s)
            (cd $v && xvfb-run -a node tft.e2e.js 2>&1 | grep -E "Mayhem memory|AssertionError|TFT tests passed|page error" | head -4 | sed "s|^|run $i $v: |") || true
            echo "run $i $v took $(( $(date +%s) - s )) s"
          done; done
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
