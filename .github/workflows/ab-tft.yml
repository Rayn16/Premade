# TEMPORARY (removed in the next commit): who keeps Tesseract's results after the TFT test's Mayhem picks on
# GitHub's Chromium 141 (today's live version, 4d525ad): the retainer path of the newest TSV string after 50 picks.
name: TFT memory A/B (temporary)
on:
  push:
    branches: [claude/project-thread-ypy88n]
    paths: ['.github/workflows/ab-tft.yml']
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - run: |
          cat > $RUNNER_TEMP/snapwho.js <<'EOF2'
          // who keeps a string alive: shortest strong retainer path from the newest string starting with `prefix` to the GC roots
          module.exports = async (cdp, prefix) => {
            const chunks = [], on = (e) => chunks.push(e.chunk);
            cdp.on('HeapProfiler.addHeapSnapshotChunk', on);
            await cdp.send('HeapProfiler.enable');
            await cdp.send('HeapProfiler.collectGarbage');
            await cdp.send('HeapProfiler.takeHeapSnapshot', { reportProgress: false });
            cdp.off('HeapProfiler.addHeapSnapshotChunk', on);
            const s = JSON.parse(chunks.join('')), m = s.snapshot.meta, nf = m.node_fields.length, ef = m.edge_fields.length;
            const NT = m.node_types[0], ET = m.edge_types[0], N = s.nodes, E = s.edges, S = s.strings;
            const nType = m.node_fields.indexOf('type'), nName = m.node_fields.indexOf('name'), nId = m.node_fields.indexOf('id'), nEc = m.node_fields.indexOf('edge_count');
            const eType = m.edge_fields.indexOf('type'), eName = m.edge_fields.indexOf('name_or_index'), eTo = m.edge_fields.indexOf('to_node');
            const count = N.length / nf, ret = Array.from({ length: count }, () => []);
            let e = 0, target = -1;
            for (let i = 0; i < count; i++) {
              for (let k = 0; k < N[i * nf + nEc]; k++, e += ef) if (ET[E[e + eType]] !== 'weak') ret[E[e + eTo] / nf].push([i, e]);
              if (/string/.test(NT[N[i * nf + nType]]) && String(S[N[i * nf + nName]]).slice(0, 80).replace(/\s+/g, ' ').startsWith(prefix) && (target < 0 || N[i * nf + nId] > N[target * nf + nId])) target = i;
            }
            if (target < 0) return 'no such string';
            const from = new Map([[target, null]]), q = [target];
            while (q.length) { const i = q.shift(); if (i === 0) break; for (const [r, ei] of ret[i]) if (!from.has(r)) { from.set(r, [i, ei]); q.push(r); } }
            if (!from.has(0)) return 'not reachable from the roots';
            const out = [];
            for (let i = 0; i !== target; ) { const [child, ei] = from.get(i); const en = ET[E[ei + eType]] === 'element' || ET[E[ei + eType]] === 'hidden' ? `[${E[ei + eName]}]` : S[E[ei + eName]];
              out.push(`${NT[N[i * nf + nType]]} ${String(S[N[i * nf + nName]]).slice(0, 60).replace(/\s+/g, ' ')} --${ET[E[ei + eType]]}:${String(en).slice(0, 40)}-->`); i = child; }
            return out.join('\n') + '\n' + String(S[N[target * nf + nName]]).slice(0, 60);
          };
          EOF2
          git worktree add ../before 4d525ad2f1a6810afb34da9abaf985c4da10a5f3
          cd ../before
          sed -i "/^    const after = await metrics();/a\    const W = require(process.env.SNAPWHO); console.log('WHO'); console.log(await W(cdp, '1 1 0 0 0 0 0 0 1280 450'));" tft.e2e.js
          git diff
      - run: |
          cd ../before
          xvfb-run -a node tft.e2e.js 2>&1 | grep -E -A16 "^WHO$" | head -17 || true
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          SNAPWHO: ${{ runner.temp }}/snapwho.js
