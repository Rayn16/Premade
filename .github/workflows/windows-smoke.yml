name: Windows installer smoke check
on:
  push:
    branches: [claude/voice-clips-6a9va7]
  workflow_dispatch:
jobs:
  install-and-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile screen audio helper
        run: cl /nologo /EHsc /std:c++17 /O2 /Fe:client/audio-capture.exe client\audio-capture.cpp /link ole32.lib mmdevapi.lib
      - name: Build and check the RE4 co-op helper
        shell: pwsh
        run: |
          dotnet build client/re4 -c Release -nologo -o re4-out
          Copy-Item re4-out/re4-helper.exe client/
          # every check on a PC without RE4, a tunnel or rules: JSON back, nothing crashes
          $s = & client/re4-helper.exe status | ConvertFrom-Json
          $s | ConvertTo-Json -Depth 4
          if ($s.error -or $s.role -ne 'none' -or ($s.game | Where-Object title -eq 'RE4 not found').Count -ne 1 -or $s.why -notmatch 'RE4 isn') { throw 're4-helper status is not what a PC without RE4 should give' }
          $p = & client/re4-helper.exe play | ConvertFrom-Json
          if ($p.note -notmatch 'RE4 isn') { throw 'Play should refuse without RE4' }
          $o = & client/re4-helper.exe theirs | ConvertFrom-Json
          if ($o.note -notmatch 'RE4 isn') { throw 'the mod switch should refuse without RE4' }
          $c = & client/re4-helper.exe char Ada | ConvertFrom-Json
          if ($c.note -notmatch 'Their mod' -or $c.inGame) { throw 'Play as should wait for their mod in a running game' }
          $c = & client/re4-helper.exe char Nobody | ConvertFrom-Json
          if ($c.note -notmatch 'unknown character') { throw 'Play as should refuse a name not in their list' }
      - name: RE4 co-op their mod's files and REFramework on the site match the pinned fingerprints
        shell: pwsh
        run: |
          $pins = [regex]::Matches((Get-Content client/re4/Checks.cs -Raw), '\["[^"]+"\] = "([0-9a-f]{64})"') | ForEach-Object { $_.Groups[1].Value }
          if ($pins.Count -ne 10) { throw "expected 10 pins, found $($pins.Count)" }
          $rf = [regex]::Match((Get-Content client/re4/Checks.cs -Raw), 'REFramework = "([0-9a-f]{64})"').Groups[1].Value
          if ((Get-FileHash "site/re4/reframework/$rf" -Algorithm SHA256).Hash.ToLower() -ne $rf) { throw 'site/re4/reframework is missing or changed' }
          foreach ($h in $pins) { if ((Get-FileHash "site/re4/their-mod/$h" -Algorithm SHA256).Hash.ToLower() -ne $h) { throw "site/re4/their-mod/$h is missing or changed" } }
      # Set up as host for real (the runner is admin, so Windows doesn't ask): Tailscale installed, firewall rules. No
      # Tailscale sign-in on a test PC, so it shows as needing one.
      - name: RE4 co-op Set up on a real Windows
        shell: pwsh
        timeout-minutes: 15
        run: |
          $log = "$([Environment]::GetFolderPath('MyDocuments'))\RE4 co-op\log.txt"
          $s = & client/re4-helper.exe setup | ConvertFrom-Json
          $s | ConvertTo-Json -Depth 4
          if ($s.note -notmatch 'set up to host') { Get-Content $log -ErrorAction SilentlyContinue; throw "Set up: $($s.note)" }
          Get-NetFirewallRule -DisplayName 'RE4 co-op WireGuard: *' | Format-Table DisplayName, Direction, Action
          if (-not (Test-Path 'C:\Program Files\Tailscale\tailscale.exe')) { throw 'Set up should install Tailscale' }
          if ($s.role -ne 'host' -or $s.setup -or $s.tailscale -notin 'NeedsLogin', 'NoState') { throw "after Set up the PC should be the host, waiting for a Tailscale sign-in: $($s.role) $($s.setup) $($s.tailscale)" }
          # again: replaces the rules
          $s = & client/re4-helper.exe setup | ConvertFrom-Json
          if ($s.note -notmatch 'set up to host' -or @(Get-NetFirewallRule -DisplayName 'RE4 co-op WireGuard: *').Count -ne 5) { throw 'Set up run twice should leave the same 5 rules' }
      # Friends: invites need Tailscale signed in, so they're refused here; codes are checked; the app link works; after
      # Remove the same PC joins as a friend (its share link opens in a browser nobody looks at).
      - name: RE4 co-op friends on a real Windows
        shell: pwsh
        timeout-minutes: 10
        run: |
          $log = "$([Environment]::GetFolderPath('MyDocuments'))\RE4 co-op\log.txt"
          function Re4($what, $arg, $stdin) { $r = if ($stdin) { $stdin | & client/re4-helper.exe $what } else { & client/re4-helper.exe $what $arg }; $o = $r | ConvertFrom-Json; Write-Host "$what -> $($o.role) $($o.tunnelIp) $($o.hostIp): $($o.note)"; $o }
          function Fail($why) { Get-Content $log -ErrorAction SilentlyContinue; throw $why }
          if ((Re4 invite $null "Test friend`nhttps://login.tailscale.com/admin/invite/abc").note -notmatch 'connect Tailscale first') { Fail 'an invite needs Tailscale connected' }
          if ((Re4 invite $null "Test friend`nhttps://evil.example/x").note -notmatch 'Paste the invite link') { Fail 'a link that is not Tailscale should be refused' }
          node client/re4link.test.js
          if ($LASTEXITCODE) { Fail 'app link' }
          $code = 'RE4COOP2.' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('Test friend|100.101.102.103|https://login.tailscale.com/admin/invite/abc'))
          if ((Re4 join $null 'RE4COOP2.bad').note -notmatch "isn't an RE4 co-op invite") { Fail 'a bad code should be refused' }
          if ((Re4 join $null 'RE4COOP1.abc').note -notmatch 'from before Tailscale') { Fail 'an old invite should say so' }
          $bad = 'RE4COOP2.' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('Test friend|10.0.0.1|https://login.tailscale.com/admin/invite/abc'))
          if ((Re4 join $null $bad).note -notmatch "isn't an RE4 co-op invite") { Fail 'an address outside Tailscale should be refused' }
          if ((Re4 join $null $code).note -notmatch 'This PC hosts') { Fail 'the host should refuse to join' }
          $r = Re4 remove
          if ($r.role -ne 'none' -or @(Get-NetFirewallRule -DisplayName 'RE4 co-op WireGuard: *' -ErrorAction SilentlyContinue).Count -ne 0) { Fail 'remove' }
          $j = Re4 join $null $code
          if ($j.role -ne 'friend' -or $j.hostIp -ne '100.101.102.103' -or ($j.privacy | Where-Object title -eq "Their mod's server blocked").Count -ne 1 -or $j.setup -or ($j.connection | Where-Object title -eq 'Tailscale: sign in').Count -ne 1) { Fail 'join' }
          if ((Re4 setup).note -notmatch 'set up as a friend') { Fail 'a friend should be refused Set up' }
          if ((Re4 remove).role -ne 'none') { Fail 'remove the friend side' }
      - name: Build Windows installer
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Check update manifest and installer
        shell: pwsh
        run: |
          $package = Get-Content client/package.json | ConvertFrom-Json
          $manifest = Get-Content client/dist/latest.yml -Raw
          if ($manifest -notmatch "(?m)^version: $([regex]::Escape($package.version))$") { throw "latest.yml does not match app version $($package.version)" }
          if (!(Test-Path client/dist/Premade-Setup.exe) -or (Get-Item client/dist/Premade-Setup.exe).Length -lt 10MB) { throw 'Installer is missing or unexpectedly small.' }
          $installPath = Join-Path $env:RUNNER_TEMP 'Premade-smoke-install'
          Start-Process -FilePath (Resolve-Path client/dist/Premade-Setup.exe) -ArgumentList @('/S', "/D=$installPath") -Wait
          $appPath = Join-Path $installPath 'Premade.exe'
          if (!(Test-Path $appPath)) { throw 'Silent install did not create Premade.exe.' }
          if (!(Test-Path (Join-Path $installPath 'resources/app.asar.unpacked/re4-helper.exe'))) { throw 're4-helper.exe is not unpacked next to app.asar.' }
          $env:LPC_SITE = 'https://rayn16.github.io/Premade/test/'
          $app = Start-Process -FilePath $appPath -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "Installed app exited during launch smoke check (exit $($app.ExitCode))." }
            Write-Host "Installed and launched Premade $($package.version)."
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
