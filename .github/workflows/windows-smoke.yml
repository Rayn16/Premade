name: Windows installer smoke check
on:
  push:
    branches: [claude/voice-clips-6a9va7]
  workflow_dispatch:
jobs:
  install-and-launch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile screen audio helper
        run: cl /nologo /EHsc /std:c++17 /O2 /Fe:client/audio-capture.exe client\audio-capture.cpp /link ole32.lib mmdevapi.lib
      - name: Build and check the RE4 co-op helper
        shell: pwsh
        run: |
          dotnet build client/re4 -c Release -nologo -o re4-out
          Copy-Item re4-out/re4-helper.exe client/
          # every check on a PC without RE4, a tunnel or rules: JSON back, nothing crashes
          $s = & client/re4-helper.exe status | ConvertFrom-Json
          $s | ConvertTo-Json -Depth 4
          if ($s.error -or $s.role -ne 'none' -or ($s.game | Where-Object title -eq 'RE4 not found').Count -ne 1 -or $s.why -notmatch 'RE4 isn') { throw 're4-helper status is not what a PC without RE4 should give' }
          $p = & client/re4-helper.exe play | ConvertFrom-Json
          if ($p.note -notmatch 'RE4 isn') { throw 'Play should refuse without RE4' }
          $o = & client/re4-helper.exe theirs | ConvertFrom-Json
          if ($o.note -notmatch 'RE4 isn') { throw 'the mod switch should refuse without RE4' }
      # Set up as host for real (the runner is admin, so Windows doesn't ask): WireGuard, tunnel, firewall rules.
      - name: RE4 co-op Set up on a real Windows
        shell: pwsh
        timeout-minutes: 10
        run: |
          $s = & client/re4-helper.exe setup | ConvertFrom-Json
          $s | ConvertTo-Json -Depth 4
          if ($s.note -notmatch 'set up to host') { throw "Set up: $($s.note)" }
          if ($s.role -ne 'host' -or $s.tunnelIp -ne '10.66.0.1' -or $s.setup) { throw 'after Set up the PC should be the host with nothing left to set up' }
          Get-NetFirewallRule -DisplayName 'RE4 co-op WireGuard: *' | Format-Table DisplayName, Direction, Action
          # again: keeps the key and the tunnel, replaces the rules
          $s = & client/re4-helper.exe setup | ConvertFrom-Json
          if ($s.note -notmatch 'set up to host' -or @(Get-NetFirewallRule -DisplayName 'RE4 co-op WireGuard: *').Count -ne 5) { throw 'Set up run twice should leave the same 5 rules' }
      - name: Build Windows installer
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Check update manifest and installer
        shell: pwsh
        run: |
          $package = Get-Content client/package.json | ConvertFrom-Json
          $manifest = Get-Content client/dist/latest.yml -Raw
          if ($manifest -notmatch "(?m)^version: $([regex]::Escape($package.version))$") { throw "latest.yml does not match app version $($package.version)" }
          if (!(Test-Path client/dist/Premade-Setup.exe) -or (Get-Item client/dist/Premade-Setup.exe).Length -lt 10MB) { throw 'Installer is missing or unexpectedly small.' }
          $installPath = Join-Path $env:RUNNER_TEMP 'Premade-smoke-install'
          Start-Process -FilePath (Resolve-Path client/dist/Premade-Setup.exe) -ArgumentList @('/S', "/D=$installPath") -Wait
          $appPath = Join-Path $installPath 'Premade.exe'
          if (!(Test-Path $appPath)) { throw 'Silent install did not create Premade.exe.' }
          if (!(Test-Path (Join-Path $installPath 'resources/app.asar.unpacked/re4-helper.exe'))) { throw 're4-helper.exe is not unpacked next to app.asar.' }
          $env:LPC_SITE = 'https://rayn16.github.io/Premade/test/'
          $app = Start-Process -FilePath $appPath -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "Installed app exited during launch smoke check (exit $($app.ExitCode))." }
            Write-Host "Installed and launched Premade $($package.version)."
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
