# Temporary (memory hunt, thread "Cut Premade memory use again"): the real app on Windows watching a friend's shared
# screen, each process's memory every 30 s. Lives on this thread's branch only.
name: Memory test
on:
  push:
    branches: [claude/project-thread-cow0rs]
jobs:
  mem:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: pwsh
        run: |
          cd client; npm ci; cd ..
          cd memtest; npm init -y | Out-Null; npm i peer@1.0.2
      - name: Real screen capture
        shell: pwsh
        run: |
          cd memtest; mkdir out-cap | Out-Null; $env:OUT = "$PWD\out-cap"
          foreach ($m in '1','0') { $env:THUMB = $m; ..\client\node_modules\.bin\electron.cmd src.js }
          foreach ($m in 'app','none') { $env:RING = $m; ..\client\node_modules\.bin\electron.cmd rec.js }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memtest
          path: memtest/out-*
